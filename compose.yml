name: whaledeck

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "5"
      compress: "true"

services:
  gateway:
    <<: *service-defaults
    container_name: whaledeck-gateway
    build:
      context: .
      dockerfile: deploy/gateway/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.15.0-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.29-alpine}
    ports:
      - "127.0.0.1:${WHALEDECK_GATEWAY_UPSTREAM_PORT:-18080}:8080"
      - "127.0.0.1:${AUTHENTIK_UPSTREAM_PORT:-18081}:8081"
    environment:
      WHALEDECK_TITLE: ${WHALEDECK_TITLE:-WhaleDeck 协同平台}
      WHALEDECK_BACKEND_VERSION: ${WHALEDECK_BACKEND_VERSION:-0.1.0}
      WHALEDECK_API_BASE_URL: /api/v1
      WHALEDECK_AUTHENTIK_URL: ${WHALEDECK_AUTHENTIK_URL:-http://192.168.22.19:8081}
      WHALEDECK_GITLAB_URL: ${WHALEDECK_GITLAB_URL:-http://192.168.22.19:8082}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - whaledeck_frontend
      - authentik_frontend
      - whaledeck_host_ingress
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512m

  api:
    <<: *service-defaults
    container_name: whaledeck-api
    # The Agent authenticates SO_PEERCRED effective credentials, therefore the
    # host whaledeck group must be this process' primary group, not only a
    # supplementary group added for filesystem access.
    user: "${WHALEDECK_RUNTIME_UID:-1654}:${WHALEDECK_AGENT_GID:?set WHALEDECK_AGENT_GID}"
    build:
      context: .
      dockerfile: src/WhaleDeck.Api/Dockerfile
      args:
        DOTNET_SDK_IMAGE: ${DOTNET_SDK_IMAGE:-mcr.microsoft.com/dotnet/sdk:10.0.402@sha256:0d99ebf1ccad15037b5c98c9fe8979d6b8dbac23812feae2277a0b277b5c5ffa}
        ASPNET_IMAGE: ${ASPNET_IMAGE:-mcr.microsoft.com/dotnet/aspnet:10.0.13@sha256:d5633778c754e89a386882eddf8dbee6942447a8a4b8267c19cf1e1158d0b0ac}
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__WhaleDeck: Host=postgres;Port=5432;Database=${WHALEDECK_DB_NAME:-whaledeck};Username=${WHALEDECK_DB_USER:-whaledeck};Password=${WHALEDECK_DB_PASSWORD:?set WHALEDECK_DB_PASSWORD};Application Name=whaledeck
      Authentication__Oidc__Enabled: "true"
      Authentication__Oidc__Internal__Authority: ${WHALEDECK_OIDC_INTERNAL_AUTHORITY:?set WHALEDECK_OIDC_INTERNAL_AUTHORITY}
      Authentication__Oidc__Internal__BackchannelHost: authentik
      Authentication__Oidc__Internal__BackchannelPort: "9000"
      Authentication__Oidc__Internal__ClientId: ${WHALEDECK_OIDC_INTERNAL_CLIENT_ID:?set WHALEDECK_OIDC_INTERNAL_CLIENT_ID}
      Authentication__Oidc__Internal__ClientSecret: ${WHALEDECK_OIDC_INTERNAL_CLIENT_SECRET:?set WHALEDECK_OIDC_INTERNAL_CLIENT_SECRET}
      Authentication__Oidc__Internal__CallbackPath: /signin-oidc/internal
      Authentication__Oidc__Internal__SignedOutCallbackPath: /signout-callback-oidc/internal
      Authentication__Oidc__External__Authority: ${WHALEDECK_OIDC_EXTERNAL_AUTHORITY:?set WHALEDECK_OIDC_EXTERNAL_AUTHORITY}
      Authentication__Oidc__External__BackchannelHost: authentik
      Authentication__Oidc__External__BackchannelPort: "9000"
      Authentication__Oidc__External__ClientId: ${WHALEDECK_OIDC_EXTERNAL_CLIENT_ID:?set WHALEDECK_OIDC_EXTERNAL_CLIENT_ID}
      Authentication__Oidc__External__ClientSecret: ${WHALEDECK_OIDC_EXTERNAL_CLIENT_SECRET:?set WHALEDECK_OIDC_EXTERNAL_CLIENT_SECRET}
      Authentication__Oidc__External__CallbackPath: /signin-oidc/external
      Authentication__Oidc__External__SignedOutCallbackPath: /signout-callback-oidc/external
      Valkey__Endpoint: valkey:6379
      Valkey__User: ${WHALEDECK_VALKEY_USER:-whaledeck}
      Valkey__Password: ${WHALEDECK_VALKEY_PASSWORD:?set WHALEDECK_VALKEY_PASSWORD}
      Agent__SocketPath: /run/whaledeck/agent.sock
      Agent__CapabilityKeyFile: /run/secrets/agent-capability.key
      Authentication__Authentik__ApiBaseUrl: http://authentik:9000/api/v3/
      Authentication__Authentik__ApiToken: ${WHALEDECK_AUTHENTIK_API_TOKEN:?set WHALEDECK_AUTHENTIK_API_TOKEN}
      Authentication__Authentik__AdministratorGroupId: ${WHALEDECK_AUTHENTIK_ADMIN_GROUP_ID:?set WHALEDECK_AUTHENTIK_ADMIN_GROUP_ID}
      DataProtection__KeyDirectory: /var/lib/whaledeck/data-protection
    volumes:
      # Mount the parent directory so reconnects see the new socket inode after an Agent restart.
      - /run/whaledeck:/run/whaledeck:ro
      - /etc/whaledeck/agent-capability.key:/run/secrets/agent-capability.key:ro
      - whaledeck_api_data_protection:/var/lib/whaledeck/data-protection
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - whaledeck_frontend
      - authentik_frontend
      - postgres_backend
      - valkey_backend
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2g

  worker:
    <<: *service-defaults
    container_name: whaledeck-worker
    user: "${WHALEDECK_RUNTIME_UID:-1654}:${WHALEDECK_AGENT_GID:?set WHALEDECK_AGENT_GID}"
    build:
      context: .
      dockerfile: src/WhaleDeck.Worker/Dockerfile
      args:
        DOTNET_SDK_IMAGE: ${DOTNET_SDK_IMAGE:-mcr.microsoft.com/dotnet/sdk:10.0.402@sha256:0d99ebf1ccad15037b5c98c9fe8979d6b8dbac23812feae2277a0b277b5c5ffa}
        DOTNET_RUNTIME_IMAGE: ${DOTNET_RUNTIME_IMAGE:-mcr.microsoft.com/dotnet/runtime:10.0.13@sha256:939555726cae4c916d212323ac3c0792996dcac2614f00e82cc40fcf059e1af3}
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__WhaleDeck: Host=postgres;Port=5432;Database=${WHALEDECK_DB_NAME:-whaledeck};Username=${WHALEDECK_DB_USER:-whaledeck};Password=${WHALEDECK_DB_PASSWORD:?set WHALEDECK_DB_PASSWORD};Application Name=whaledeck-worker
      Valkey__Endpoint: valkey:6379
      Valkey__User: ${WHALEDECK_VALKEY_USER:-whaledeck}
      Valkey__Password: ${WHALEDECK_VALKEY_PASSWORD:?set WHALEDECK_VALKEY_PASSWORD}
      Agent__SocketPath: /run/whaledeck/agent.sock
      Agent__CapabilityKeyFile: /run/secrets/agent-capability.key
      Authentication__Authentik__ApiBaseUrl: http://authentik:9000/api/v3/
      Authentication__Authentik__ApiToken: ${WHALEDECK_AUTHENTIK_API_TOKEN:?set WHALEDECK_AUTHENTIK_API_TOKEN}
      Authentication__Authentik__AdministratorGroupId: ${WHALEDECK_AUTHENTIK_ADMIN_GROUP_ID:?set WHALEDECK_AUTHENTIK_ADMIN_GROUP_ID}
    volumes:
      - /run/whaledeck:/run/whaledeck:ro
      - /etc/whaledeck/agent-capability.key:/run/secrets/agent-capability.key:ro
      # Private, 0600 registry is visible only to Worker. Parent mount sees atomic replacements.
      - /etc/whaledeck/notifications:/run/secrets/notifications:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "dotnet", "WhaleDeck.Worker.dll", "--health-check"]
      interval: 12s
      timeout: 5s
      retries: 4
      start_period: 60s
    networks:
      - authentik_frontend
      - postgres_backend
      - valkey_backend
      - notifications_egress
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1g

  migrator:
    <<: *service-defaults
    restart: "no"
    profiles: ["tools"]
    build:
      context: .
      dockerfile: src/WhaleDeck.Migrator/Dockerfile
      args:
        DOTNET_SDK_IMAGE: ${DOTNET_SDK_IMAGE:-mcr.microsoft.com/dotnet/sdk:10.0.402@sha256:0d99ebf1ccad15037b5c98c9fe8979d6b8dbac23812feae2277a0b277b5c5ffa}
        DOTNET_RUNTIME_IMAGE: ${DOTNET_RUNTIME_IMAGE:-mcr.microsoft.com/dotnet/runtime:10.0.13@sha256:939555726cae4c916d212323ac3c0792996dcac2614f00e82cc40fcf059e1af3}
    environment:
      ConnectionStrings__WhaleDeck: Host=postgres;Port=5432;Database=${WHALEDECK_DB_NAME:-whaledeck};Username=${WHALEDECK_DB_USER:-whaledeck};Password=${WHALEDECK_DB_PASSWORD:?set WHALEDECK_DB_PASSWORD};Application Name=whaledeck-migrator
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - postgres_backend

networks:
  notifications_egress:
    name: whaledeck-notifications-egress
    driver: bridge
    labels:
      io.whaledeck.protected: "true"
  whaledeck_frontend:
    name: whaledeck-app-ui
    internal: true
  authentik_frontend:
    name: database-platform-app-authentik
    external: true
  whaledeck_host_ingress:
    name: whaledeck-host-ingress
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  postgres_backend:
    name: database-platform-db-postgres
    external: true
  valkey_backend:
    name: database-platform-cache-general
    external: true

volumes:
  whaledeck_api_data_protection:
    name: whaledeck-api-data-protection
