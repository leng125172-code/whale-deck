pid /tmp/nginx.pid;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  # Docker container addresses change whenever an upstream is recreated.  A
  # variable proxy target makes nginx ask Docker's embedded DNS resolver again
  # instead of retaining the address that existed when nginx started.
  resolver 127.0.0.11 valid=10s ipv6=off;

  client_body_temp_path /tmp/client_body;
  # Permit cleanup of legacy OIDC cookies after interrupted logins. Limits
  # remain bounded; the callback preparation endpoint expires stale cookies.
  large_client_header_buffers 4 32k;
  proxy_buffer_size 64k;
  proxy_buffers 4 64k;
  proxy_busy_buffers_size 128k;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  access_log off;
  error_log /dev/stderr warn;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    set $api_upstream http://api:8080;

    location = /runtime-config.js {
      alias /tmp/runtime-config.js;
      add_header Cache-Control "no-store" always;
    }

    location = /build-info.json {
      alias /usr/share/nginx/build-info.json;
      default_type application/json;
      add_header Cache-Control "no-store" always;
    }

    # Binary bytes are never buffered into gateway temporary files. Longer
    # idle/read limits are scoped to registered file-management endpoints.
    location ^~ /api/v1/files/ {
      client_max_body_size 1024m;
      client_body_timeout 30s;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 660s;
      proxy_send_timeout 30s;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /health/ {
      proxy_pass $api_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ASP.NET Core's OIDC middleware owns these browser-facing callback
    # endpoints.  They must never fall through to the Vue history fallback,
    # especially because Authentik completes code flow with an HTTP POST.
    location /signin-oidc/ {
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /signout-callback-oidc/ {
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /swagger/ {
      proxy_pass $api_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /openapi/v1.json {
      proxy_pass $api_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }

  server {
    listen 8081;
    server_name _;
    # Brand backgrounds are larger than nginx's 1 MiB default. Keep uploads
    # bounded while allowing native Authentik media (including our 1.7 MiB PNG).
    client_max_body_size 8m;
    set $authentik_upstream http://authentik:9000;

    location / {
      proxy_pass $authentik_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 300s;
    }
  }
}
