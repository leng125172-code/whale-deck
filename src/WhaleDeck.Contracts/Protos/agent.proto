syntax = "proto3";

option csharp_namespace = "WhaleDeck.Contracts.Agent.V1";
package whaledeck.agent.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

message RequestContext {
  string trace_id = 1;
  string actor_subject = 2;
  string job_id = 3;
  string idempotency_key = 4;
  bytes capability = 5;
}

message ResourceReference {
  string resource_id = 1;
  string resource_type = 2;
}

enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_QUEUED = 1;
  OPERATION_STATE_RUNNING = 2;
  OPERATION_STATE_WAITING_FOR_HEALTH = 3;
  OPERATION_STATE_SUCCEEDED = 4;
  OPERATION_STATE_FAILED = 5;
  OPERATION_STATE_ROLLING_BACK = 6;
  OPERATION_STATE_ROLLED_BACK = 7;
  OPERATION_STATE_CANCELED = 8;
}

message OperationHandle {
  string operation_id = 1;
  OperationState state = 2;
  string phase = 3;
  int32 progress_percent = 4;
  string error_code = 5;
  // Structured, non-secret operation result. Sensitive values must continue
  // to use the one-time secret store and never appear here.
  string result_json = 6;
}

message OperationRequest {
  RequestContext context = 1;
  string operation_id = 2;
}

message CapabilitiesResponse {
  string agent_version = 1;
  uint32 protocol_major = 2;
  uint32 protocol_minor = 3;
  string operating_system = 4;
  repeated string capabilities = 5;
}

message HealthResponse {
  bool healthy = 1;
  bool docker_available = 2;
  bool systemd_available = 3;
  string status = 4;
  google.protobuf.Timestamp observed_at_utc = 5;
}

message HostInfoResponse {
  string host_name = 1;
  string distribution = 2;
  string kernel_version = 3;
  string architecture = 4;
  int64 boot_time_unix_seconds = 5;
  int64 uptime_seconds = 6;
  uint32 logical_processor_count = 7;
  uint64 total_memory_bytes = 8;
  repeated HostAddress addresses = 9;
}

message HostAddress {
  string interface_name = 1;
  string address = 2;
}

message MetricsRequest {
  RequestContext context = 1;
  // Zero requests one batch and closes the stream. Values from 6 through 60
  // keep the stream open at the requested sampling interval.
  uint32 interval_seconds = 2;
  // Capability host.metrics.replay, protocol minor >= 37. Only with interval_seconds=0.
  // Replay retained canonical batches, bounded by 120 batches / 65536 metric points.
  // Each batch ends in batch.complete; the RPC ends normally after the snapshot.
  bool replay_recent = 3;
  // Exclusive raw timestamp, acknowledged by the caller only AFTER successful persistence.
  // Absence requests the available buffer. Eviction/offline gaps are never fabricated.
  google.protobuf.Timestamp after_sampled_at_utc = 4;
}

message MetricPoint {
  string metric_kind = 1;
  string device_id = 2;
  double value = 3;
  string unit = 4;
  string quality = 5;
  google.protobuf.Timestamp sampled_at_utc = 6;
}

message JournalRequest {
  string unit = 1;
  uint32 take = 2;
  uint32 since_minutes = 3;
  string priority = 4;
  string keyword = 5;
}

message JournalEntry {
  google.protobuf.Timestamp occurred_at_utc = 1;
  string unit = 2;
  string priority = 3;
  string process = 4;
  int32 process_id = 5;
  string message = 6;
}

message JournalResponse {
  repeated JournalEntry entries = 1;
}

message DiagnosticBundleRequest {
  string bundle_id = 1;
}

message DiagnosticBundleChunk {
  bytes content = 1;
}

message DockerInfoResponse {
  string server_version = 1;
  string api_version = 2;
  string operating_system = 3;
  string architecture = 4;
  int32 containers = 5;
  int32 images = 6;
  string logging_driver = 7;
}

message ListContainersRequest {
  RequestContext context = 1;
  bool include_stopped = 2;
}

message ContainerSummary {
  string id = 1;
  string name = 2;
  string image = 3;
  string state = 4;
  string status = 5;
  bool protected_resource = 6;
  string protection_level = 7;
  map<string, string> labels = 8;
  repeated string ports = 9;
  repeated string networks = 10;
  repeated string addresses = 11;
  google.protobuf.Timestamp created_at_utc = 12;
  string image_id = 13;
  repeated string volume_names = 14;
  repeated string network_ids = 15;
}

message ListContainersResponse {
  repeated ContainerSummary containers = 1;
}

message ContainerLogsRequest {
  string container_id = 1;
  uint32 tail = 2;
  uint32 since_minutes = 3;
}

message ContainerLogsResponse {
  repeated string lines = 1;
  bool truncated = 2;
}

message ContainerStatsResponse {
  map<string, string> values = 1;
}

message ContainerUsageSnapshot {
  string container_id = 1;
  string state = 2;
  google.protobuf.Timestamp sampled_at_utc = 3;
  optional double cpu_percent = 4;
  double cpu_window_seconds = 5;
  optional uint64 memory_used_bytes = 6;
  optional uint64 memory_limit_bytes = 7;
  optional double memory_percent = 8;
  optional uint64 network_receive_bytes = 9;
  optional uint64 network_send_bytes = 10;
  optional uint64 block_read_bytes = 11;
  optional uint64 block_write_bytes = 12;
  optional uint64 pids = 13;
  string quality = 14;
}

message ContainerUsageBatch {
  repeated ContainerUsageSnapshot items = 1;
  google.protobuf.Timestamp sampled_at_utc = 2;
  bool is_stale = 3;
  bool is_truncated = 4;
  int32 skipped_count = 5;
  int32 total_count = 6;
  int32 interval_seconds = 7;
}

message DockerEventsRequest {
  int64 since_unix_seconds = 1;
  uint32 take = 2;
}

message DockerEvent {
  string fingerprint = 1;
  google.protobuf.Timestamp occurred_at_utc = 2;
  string event_type = 3;
  string action = 4;
  string resource_id = 5;
  string resource_name = 6;
  string image = 7;
  map<string, string> attributes = 8;
}

message DockerEventsResponse {
  repeated DockerEvent events = 1;
}

message ContainerInspectResponse {
  string id = 1;
  string name = 2;
  string image = 3;
  repeated string environment_names = 4;
  repeated string command = 5;
  repeated string entrypoint = 6;
  map<string, string> labels = 7;
  repeated string ports = 8;
  repeated string volumes = 9;
  repeated string networks = 10;
  string restart_policy = 11;
  double cpus = 12;
  int64 memory_mb = 13;
  repeated string health_command = 14;
  int64 health_interval_seconds = 15;
  int64 health_timeout_seconds = 16;
  int64 health_retries = 17;
  ContainerRelationships relationships = 18;
}

// Read-only, bounded native metadata. No environment values, driver options or arbitrary configuration.
message ContainerRelationships {
  string image_id = 1;
  string compose_project = 2;
  string compose_service = 3;
  string network_mode = 4;
  repeated ContainerNetworkEndpoint endpoints = 5;
  repeated ContainerMount mounts = 6;
  repeated ContainerPortBinding port_bindings = 7;
  bool is_truncated = 8;
}
message ContainerNetworkEndpoint {
  string name = 1;
  string network_id = 2;
  string ipv4_address = 3;
  int64 ipv4_prefix_length = 4;
  string ipv4_gateway = 5;
  string ipv6_address = 6;
  int64 ipv6_prefix_length = 7;
  string ipv6_gateway = 8;
  string mac_address = 9;
}
message ContainerMount {
  string type = 1;
  string name = 2;
  string source = 3;
  string destination = 4;
  bool read_write = 5;
}
message ContainerPortBinding {
  string container_port = 1;
  string host_address = 2;
  string host_port = 3;
  bool published = 4;
}

message ImageMetadataRequest {
  RequestContext context = 1;
  string image = 2;
  bool pull_if_missing = 3;
}

message ImageMetadataResponse {
  string image = 1;
  string image_id = 2;
  repeated string environment = 3;
  repeated string exposed_ports = 4;
  repeated string volumes = 5;
  repeated string entrypoint = 6;
  repeated string command = 7;
  map<string, string> labels = 8;
}

enum ContainerAction {
  CONTAINER_ACTION_UNSPECIFIED = 0;
  CONTAINER_ACTION_START = 1;
  CONTAINER_ACTION_STOP = 2;
  CONTAINER_ACTION_RESTART = 3;
  CONTAINER_ACTION_DELETE = 4;
}

message ChangeContainerStateRequest {
  RequestContext context = 1;
  string container_id = 2;
  ContainerAction action = 3;
  uint32 timeout_seconds = 4;
  bool preserve_volumes = 5;
  string plan_hash = 6;
}

message RegisteredResourceRequest {
  RequestContext context = 1;
  ResourceReference resource = 2;
}

message ResourceCollectionResponse {
  repeated ResourceSnapshot resources = 1;
}

// Deliberately excludes existing environment values, command and entrypoint contents.
message ApplicationConfigurationResponse {
  string resource_id = 1;
  string fingerprint = 2;
  repeated ApplicationServiceConfiguration services = 3;
  repeated string environment_names = 4;
  bool auto_update = 5;
  string version_policy = 6;
  string maintenance_window = 7;
  repeated string dependencies = 8;
  repeated string approved_networks = 9;
  string owned_data_directory = 10;
}

message ApplicationServiceConfiguration {
  string name = 1;
  string image = 2;
  double cpus = 3;
  int64 memory_mb = 4;
  string restart_policy = 5;
  repeated string ports = 6;
  bool command_present = 7;
  bool entrypoint_present = 8;
  repeated string environment_names = 9;
  repeated ApplicationConfigurationMount mounts = 10;
  repeated string networks = 11;
  string network_mode = 12;
}

message ApplicationConfigurationMount {
  string type = 1;
  string source = 2;
  string target = 3;
  bool read_only = 4;
}

message ResourceSnapshot {
  string resource_id = 1;
  string display_name = 2;
  string resource_type = 3;
  string state = 4;
  string version = 5;
  bool protected_resource = 6;
  map<string, string> attributes = 7;
}

message RegisteredActionRequest {
  RequestContext context = 1;
  ResourceReference resource = 2;
  string action = 3;
  string plan_hash = 4;
  map<string, string> parameters = 5;
}

message PlanResponse {
  string plan_hash = 1;
  google.protobuf.Timestamp expires_at_utc = 2;
  repeated string changes = 3;
  repeated string warnings = 4;
}

message DockerSettingsResponse {
  string settings_json = 1;
  repeated string editable_keys = 2;
}

service AgentService {
  rpc GetCapabilities(google.protobuf.Empty) returns (CapabilitiesResponse);
  rpc GetHealth(google.protobuf.Empty) returns (HealthResponse);
  rpc WatchHealth(google.protobuf.Empty) returns (stream HealthResponse);
}

service OperationService {
  rpc GetOperation(OperationRequest) returns (OperationHandle);
  rpc GetMaintenanceStatus(google.protobuf.Empty) returns (OperationHandle);
  rpc CancelOperation(OperationRequest) returns (OperationHandle);
  rpc WatchOperation(OperationRequest) returns (stream OperationHandle);
}

service HostService {
  rpc GetHostInfo(google.protobuf.Empty) returns (HostInfoResponse);
  rpc StreamMetrics(MetricsRequest) returns (stream MetricPoint);
  rpc ListNetworkInterfaces(google.protobuf.Empty) returns (ResourceCollectionResponse);
  rpc ListStorageDevices(google.protobuf.Empty) returns (ResourceCollectionResponse);
  rpc QueryJournal(JournalRequest) returns (JournalResponse);
  rpc ListProcesses(HostProcessesRequest) returns (HostProcessesResponse);
  rpc GetProcess(HostProcessRequest) returns (HostProcessSnapshot);
  rpc RebootHost(RegisteredActionRequest) returns (OperationHandle);
}

message HostProcessesRequest {
  uint32 page = 1;
  uint32 page_size = 2;
  string sort = 3;
  bool descending = 4;
  string filter = 5;
}

message HostProcessRequest {
  int32 pid = 1;
  string instance_id = 2;
}

message HostProcessSnapshot {
  int32 pid = 1;
  int32 parent_pid = 2;
  uint32 user_id = 3;
  string instance_id = 4;
  string name = 5;
  string state = 6;
  int32 thread_count = 7;
  google.protobuf.Timestamp started_at_utc = 8;
  double cpu_time_seconds = 9;
  optional double cpu_percent = 10;
  int64 memory_bytes = 11;
  int64 virtual_memory_bytes = 12;
}

message HostProcessesResponse {
  repeated HostProcessSnapshot items = 1;
  int32 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
  google.protobuf.Timestamp sampled_at_utc = 5;
  double cpu_window_seconds = 6;
  bool is_stale = 7;
  bool is_truncated = 8;
  int32 skipped_count = 9;
}

service DockerService {
  rpc GetEngineInfo(google.protobuf.Empty) returns (DockerInfoResponse);
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);
  rpc GetContainerLogs(ContainerLogsRequest) returns (ContainerLogsResponse);
  rpc GetContainerStats(ResourceReference) returns (ContainerStatsResponse);
  rpc GetContainerUsage(google.protobuf.Empty) returns (ContainerUsageBatch);
  rpc ListEvents(DockerEventsRequest) returns (DockerEventsResponse);
  rpc InspectContainer(ResourceReference) returns (ContainerInspectResponse);
  rpc ChangeContainerState(ChangeContainerStateRequest) returns (OperationHandle);
  rpc ListImages(google.protobuf.Empty) returns (ResourceCollectionResponse);
  rpc ListNetworks(google.protobuf.Empty) returns (ResourceCollectionResponse);
  rpc ListVolumes(google.protobuf.Empty) returns (ResourceCollectionResponse);
  rpc InspectImage(ImageMetadataRequest) returns (ImageMetadataResponse);
  rpc PlanAction(RegisteredActionRequest) returns (PlanResponse);
  rpc RunAction(RegisteredActionRequest) returns (OperationHandle);
}

message BackupTargetCapacityResponse {
  string target_directory_id = 1;
  bool available = 2;
  int64 total_bytes = 3;
  int64 used_bytes = 4;
  int64 free_bytes = 5;
  google.protobuf.Timestamp observed_at_utc = 6;
  string error_code = 7;
}

service ManagedResourceService {
  rpc GetBackupTargetCapacity(google.protobuf.Empty) returns (BackupTargetCapacityResponse);
  rpc GetApplicationConfiguration(RegisteredResourceRequest) returns (ApplicationConfigurationResponse);
  rpc PlanAction(RegisteredActionRequest) returns (PlanResponse);
  rpc ListDatabaseInstances(google.protobuf.Empty) returns (ResourceCollectionResponse);
  rpc RunDatabaseAction(RegisteredActionRequest) returns (OperationHandle);
  rpc ListSystemdUnits(google.protobuf.Empty) returns (ResourceCollectionResponse);
  rpc RunSystemdAction(RegisteredActionRequest) returns (OperationHandle);
  rpc ListComposeProjects(google.protobuf.Empty) returns (ResourceCollectionResponse);
  rpc RunComposeAction(RegisteredActionRequest) returns (OperationHandle);
  rpc GetConfigRepositoryStatus(RegisteredResourceRequest) returns (ResourceSnapshot);
  rpc GetDockerSettings(google.protobuf.Empty) returns (DockerSettingsResponse);
  rpc RunConfigRepositoryAction(RegisteredActionRequest) returns (OperationHandle);
  rpc RunPlatformMaintenance(RegisteredActionRequest) returns (OperationHandle);
  rpc DownloadDiagnosticBundle(DiagnosticBundleRequest) returns (stream DiagnosticBundleChunk);
}

// Private bytes are transient UDS input only, never a durable OperationHandle.
message NotificationConfigurationRequest {
  string channel_id = 1;
  string operation_id = 2;
  string expected_revision = 3;
  string action = 4;
  bytes private_json = 5;
  RequestContext context = 6;
}

message NotificationConfigurationLookup { string channel_id = 1; string operation_id = 2; }
message NotificationConfigurationMetadata {
  string revision = 1;
  string destination_reference = 2;
  string credential_reference = 3;
  bool has_target = 4;
  bool has_credential = 5;
  bool applied = 6;
  bool replayed = 7;
  string operation_id = 8;
  bool binding_current = 9;
}

service NotificationConfigurationService {
  rpc Inspect(NotificationConfigurationLookup) returns (NotificationConfigurationMetadata);
  rpc Apply(NotificationConfigurationRequest) returns (NotificationConfigurationMetadata);
}

// Host PTY only. Not an arbitrary executable/UID/path RPC. The first frame
// opens one root-recorded UUID; subsequent frames carry input, resize or close.
message HostTerminalFrame {
  string session_id = 1;
  RequestContext context = 2;
  string kind = 3;
  bytes data = 4;
  uint32 columns = 5;
  uint32 rows = 6;
}
message HostTerminalEvent {
  string kind = 1;
  bytes data = 2;
  string code = 3;
  int32 exit_code = 4;
}
service HostTerminalService {
  rpc Connect(stream HostTerminalFrame) returns (stream HostTerminalEvent);
}

// Container Exec has a dedicated method capability. Only the first frame may
// bind a full immutable container ID, startup instance and fixed shell choice.
message ContainerTerminalFrame {
  HostTerminalFrame payload = 1;
  string container_id = 2;
  string instance_id = 3;
  string shell = 4;
}
message ContainerTerminalTarget {
  string container_id = 1;
  string name = 2;
  string instance_id = 3;
  string image_id = 4;
  string configured_user = 5;
}
service ContainerTerminalService {
  rpc Inspect(ResourceReference) returns (ContainerTerminalTarget);
  rpc Connect(stream ContainerTerminalFrame) returns (stream HostTerminalEvent);
}

// Registered host roots only; paths are relative and never host executables.
// A separate capability/method family binds reads to a running immutable
// container startup. No host root ID, shell, command or upload action here.
message ContainerFileLocation { string container_id = 1; string instance_id = 2; string path = 3; }
message ContainerFileListRequest { ContainerFileLocation location = 1; string after = 2; uint32 take = 3; }
message ContainerFileDownloadRequest { ContainerFileLocation location = 1; string expected_version = 2; }
service ContainerFileService {
  rpc InspectTarget(ResourceReference) returns (ContainerTerminalTarget);
  rpc List(ContainerFileListRequest) returns (FileListResponse);
  rpc Inspect(ContainerFileLocation) returns (FileEntry);
  rpc Download(ContainerFileDownloadRequest) returns (stream FileDownloadFrame);
}

// Independent write family. Its single-use capability covers the exact request
// (or first upload header), including the complete body digest/length.
message ContainerUploadTarget {
  ContainerFileLocation location = 1; string target_proof = 2;
  string expected_parent_version = 3; string expected_version = 4; int64 current_size_bytes = 5;
}
message ContainerUploadHeader {
  ContainerFileLocation location = 1; string operation_id = 2; string owner = 3;
  int64 size_bytes = 4; string sha256 = 5; string expected_version = 6;
  string expected_parent_version = 7; string expected_target_proof = 8; RequestContext context = 9;
  // Optional minor43 capability: attributes are derived by Root from this
  // exact verified capture. No raw uid/gid/mode fields are accepted.
  ContainerRestoreSource restore_source = 10;
}
message ContainerRestoreSource { string capture_id = 1; string capture_hash = 2; string path = 3; }
message ContainerUploadFrame { ContainerUploadHeader header = 1; bytes data = 2; int64 offset = 3; bool commit = 4; }
message ContainerUploadReference {
  string container_id = 1; string instance_id = 2; string operation_id = 3; string owner = 4; RequestContext context = 5;
  string expected_target_proof = 6;
}
message ContainerUploadBackup {
  FileHddBackupProof proof = 1; string container_id = 2; string instance_id = 3; string target_proof = 4;
}
message ContainerUploadReceipt {
  string container_id = 1; string instance_id = 2; FileUploadReceipt upload = 3;
  ContainerUploadBackup backup = 4; string target_proof = 5;
}
// Receipt-only recovery never re-enters a stopped/restarted target namespace.
// Context is the current recovery actor; Original.Context stays immutable.
message ContainerUploadRecoveryRequest {
  ContainerUploadReference original = 1; string recovery_id = 2;
  string expected_observation_hash = 3; RequestContext context = 4;
}
message ContainerUploadRecoveryObservation {
  string container_id = 1; string instance_id = 2; string operation_id = 3; string target_proof = 4;
  string root_state = 5; string original_record_hash = 6; bool sealed = 7; string seal_id = 8;
  bool binding_current = 9; bool may_have_published = 10; bool retained_objects = 11; string observation_hash = 12;
}
service ContainerFileWriteService {
  rpc InspectTarget(ContainerFileLocation) returns (ContainerUploadTarget);
  rpc StageUpload(stream ContainerUploadFrame) returns (ContainerUploadReceipt);
  rpc Publish(ContainerUploadReference) returns (ContainerUploadReceipt);
  rpc Inspect(ContainerUploadReference) returns (ContainerUploadReceipt);
  rpc Discard(ContainerUploadReference) returns (ContainerUploadReceipt);
  rpc ObserveRecovery(ContainerUploadReference) returns (ContainerUploadRecoveryObservation);
  rpc SealRecovery(ContainerUploadRecoveryRequest) returns (ContainerUploadRecoveryObservation);
}

// Historical content remains container-scoped even after that container restarts.
// Presence in List is not full content verification; ReadSource is bounded and
// acknowledges end only after complete Root validation and successful helper EOF.
message ContainerHistoryListRequest {
  ContainerFileLocation location = 1; string after = 2; uint32 take = 3; string expected_version = 4;
}
message ContainerHistoryEntry {
  string capture_id = 1; string container_id = 2; string original_instance_id = 3;
  string path = 4; string source_version = 5; int64 size_bytes = 6; string sha256 = 7;
  int64 created_at_unix_ms = 8; bool different_source_device = 9; string availability = 10; string capture_hash = 11;
}
message ContainerHistoryPage {
  ContainerFileLocation location = 1; string target_proof = 2; repeated ContainerHistoryEntry entries = 3;
  string version = 4; string next_cursor = 5; uint32 scanned = 6; uint32 invalid_records = 7; bool complete = 8;
}
message ContainerHistorySourceRequest {
  ContainerFileLocation location = 1; string capture_id = 2; string expected_capture_hash = 3;
}
message ContainerHistorySourceFrame {
  string kind = 1; ContainerHistoryEntry metadata = 2; bytes data = 3;
  int64 offset = 4; string sha256 = 5; int64 size_bytes = 6; string target_proof = 7; string capture_hash = 8;
}
service ContainerHistoryService {
  rpc List(ContainerHistoryListRequest) returns (ContainerHistoryPage);
  rpc ReadSource(ContainerHistorySourceRequest) returns (stream ContainerHistorySourceFrame);
}

// Independent content-bound authority. No host path, raw UID/GID input or Exec.
// Owner IDs are derived by Root during Plan, then frozen in the signed intent.
message ContainerDirectoryCommand { ContainerFileLocation location = 1; string mode = 2; }
message ContainerDirectoryPlan {
  uint32 schema_version = 1; ContainerDirectoryCommand command = 2; string target_proof = 3;
  FileDirectoryIdentity parent_identity = 4; string parent_version = 5;
  uint32 owner_uid = 6; uint32 owner_gid = 7; string fingerprint = 8;
}
message ContainerDirectoryPlanRequest { ContainerDirectoryCommand command = 1; RequestContext context = 2; }
message ContainerDirectoryRequest {
  string operation_id = 1; string owner = 2; ContainerDirectoryPlan plan = 3; RequestContext context = 4;
}
message ContainerDirectoryReceipt {
  string operation_id = 1; string container_id = 2; string instance_id = 3; string fingerprint = 4;
  string target_proof = 5; string state = 6; string version = 7; bool binding_current = 8; bool replayed = 9;
}
service ContainerDirectoryService {
  rpc Plan(ContainerDirectoryPlanRequest) returns (ContainerDirectoryPlan);
  rpc Apply(ContainerDirectoryRequest) returns (ContainerDirectoryReceipt);
  rpc Inspect(ContainerDirectoryRequest) returns (ContainerDirectoryReceipt);
  rpc Discard(ContainerDirectoryRequest) returns (ContainerDirectoryReceipt);
}

// Same-container copies only. Complete typed summaries, never a full tree
// manifest, arbitrary host root/path, executable or client-selected owner.
// Root derives ownership during Plan; the signed request freezes that result.
message ContainerCopyCommand {
  ContainerFileLocation source = 1; string target_path = 2; string expected_version = 3;
}
message ContainerCopyPlan {
  uint32 schema_version = 1; ContainerCopyCommand command = 2; string kind = 3;
  string target_proof = 4; FileObjectIdentity source_identity = 5;
  int64 source_changed_at_unix_ns = 6; FileDirectoryIdentity source_parent = 7;
  FileDirectoryIdentity target_parent = 8; string target_parent_version = 9;
  uint32 owner_uid = 10; uint32 owner_gid = 11; string fingerprint = 12;
  oneof inner_plan { FileOperationPlan file_plan = 13; FileTreeCopyPlan tree_plan = 14; }
}
message ContainerCopyPlanRequest { ContainerCopyCommand command = 1; RequestContext context = 2; }
message ContainerCopyRequest {
  string operation_id = 1; string owner = 2; ContainerCopyPlan plan = 3; RequestContext context = 4;
}
message ContainerCopyReceipt {
  string operation_id = 1; string container_id = 2; string instance_id = 3;
  string kind = 4; string fingerprint = 5; string target_proof = 6; string state = 7;
  string version = 8; bool binding_current = 9; bool private_may_exist = 10; bool replayed = 11;
}
service ContainerCopyService {
  rpc Plan(ContainerCopyPlanRequest) returns (ContainerCopyPlan);
  rpc Apply(ContainerCopyRequest) returns (ContainerCopyReceipt);
  rpc Inspect(ContainerCopyRequest) returns (ContainerCopyReceipt);
  rpc Discard(ContainerCopyRequest) returns (ContainerCopyReceipt);
}

// Move is a separate authority and receipt domain. Nullable facts preserve unknown.
message ContainerMoveCommand {
  ContainerFileLocation source = 1; string target_path = 2; string expected_version = 3;
}
message ContainerMovePlan {
  uint32 schema_version = 1; ContainerMoveCommand command = 2; string kind = 3;
  string target_proof = 4; FileObjectIdentity source_identity = 5;
  int64 source_changed_at_unix_ns = 6; FileDirectoryIdentity source_parent = 7;
  FileDirectoryIdentity target_parent = 8; string target_parent_version = 9;
  uint32 owner_uid = 10; uint32 owner_gid = 11; string fingerprint = 12;
  oneof inner_plan { FileOperationPlan file_plan = 13; FileTreeMovePlan tree_plan = 14; }
  string operation_kind = 15;
}
message ContainerMovePlanRequest { ContainerMoveCommand command = 1; RequestContext context = 2; }
message ContainerMoveRequest {
  string operation_id = 1; string owner = 2; ContainerMovePlan plan = 3; RequestContext context = 4;
}
message ContainerMoveReceipt {
  string operation_id = 1; string container_id = 2; string instance_id = 3;
  string kind = 4; string fingerprint = 5; string target_proof = 6; string state = 7;
  string version = 8; bool binding_current = 9; bool private_may_exist = 10; bool replayed = 11;
  optional bool destination_published = 12; optional bool source_removed = 13; optional bool source_retained = 14;
  string operation_kind = 15;
}
service ContainerMoveService {
  rpc Plan(ContainerMovePlanRequest) returns (ContainerMovePlan);
  rpc Apply(ContainerMoveRequest) returns (ContainerMoveReceipt);
  rpc Inspect(ContainerMoveRequest) returns (ContainerMoveReceipt);
  rpc Discard(ContainerMoveRequest) returns (ContainerMoveReceipt);
}

message FileLocation { string root_id = 1; string path = 2; }
message FileRoot { string id = 1; string name = 2; repeated string actions = 3; }
message FileRoots { repeated FileRoot roots = 1; }
message FileEntry {
  string name = 1; string kind = 2; int64 size_bytes = 3;
  int64 modified_at_unix_ms = 4; string version = 5; string mode = 6; bool is_protected = 7;
}
message FileListRequest { FileLocation location = 1; string after = 2; uint32 take = 3; }
message FileListResponse { repeated FileEntry entries = 1; string next_cursor = 2; string version = 3; }
message FileSearchRequest {
  FileLocation location = 1; string query = 2; string kind = 3;
  bool match_case = 4; string cursor = 5; uint32 take = 6;
}
message FileSearchHit { string path = 1; FileEntry entry = 2; }
message FileSearchResponse {
  repeated FileSearchHit entries = 1; string next_cursor = 2; uint32 scanned_entries = 3;
  uint32 excluded_entries = 4; bool complete = 5; string stop_reason = 6; bool depth_limited = 7;
}
message FileContentSearchRequest {
  FileLocation location = 1; string query = 2; bool match_case = 3;
  string cursor = 4; uint32 take = 5; uint32 max_file_bytes = 6;
}
message FileContentSearchHit {
  string path = 1; FileEntry entry = 2; uint32 line_number = 3;
  string excerpt = 4; bool excerpt_truncated = 5;
}
message FileContentSearchResponse {
  repeated FileContentSearchHit entries = 1; string next_cursor = 2; uint32 scanned_entries = 3;
  uint32 excluded_entries = 4; bool complete = 5; string stop_reason = 6; bool depth_limited = 7;
  uint32 scanned_files = 8; int64 read_bytes = 9; uint32 skipped_non_text_files = 10; uint32 skipped_oversized_files = 11;
}
message FileDownloadRequest { FileLocation location = 1; string expected_version = 2; }
message FileDownloadFrame { string kind = 1; FileEntry metadata = 2; bytes data = 3; int64 offset = 4; string sha256 = 5; string version = 6; int64 size_bytes = 7; }
message FileUploadHeader {
  FileLocation location = 1; string operation_id = 2; string owner = 3;
  int64 size_bytes = 4; string sha256 = 5; string expected_version = 6; RequestContext context = 7;
}
message FileUploadFrame { FileUploadHeader header = 1; bytes data = 2; int64 offset = 3; bool commit = 4; }
message FileUploadLookup { string operation_id = 1; string owner = 2; }
message FileUploadReceipt {
  string operation_id = 1; string state = 2; int64 size_bytes = 3; string sha256 = 4;
  string version = 5; bool previous_retained = 6; bool replayed = 7; bool binding_current = 8; bool is_in_progress = 9;
  FileHddBackupProof hdd_backup = 10;
  string result_code = 11;
}
message FileHddBackupProof {
  string operation_id = 1; string storage_id = 2; string source_version = 3;
  int64 size_bytes = 4; string sha256 = 5; int64 created_at_unix_ms = 6; bool different_source_device = 7;
}
service FileTransferService {
  rpc ListRoots(google.protobuf.Empty) returns (FileRoots);
  rpc List(FileListRequest) returns (FileListResponse);
  rpc Directories(FileListRequest) returns (FileListResponse);
  rpc Search(FileSearchRequest) returns (FileSearchResponse);
  rpc SearchContent(FileContentSearchRequest) returns (FileContentSearchResponse);
  rpc Inspect(FileLocation) returns (FileEntry);
  rpc Download(FileDownloadRequest) returns (stream FileDownloadFrame);
  rpc Upload(stream FileUploadFrame) returns (FileUploadReceipt);
  // Separate method capabilities: API may stage bytes, Worker may publish or discard.
  rpc StageUpload(stream FileUploadFrame) returns (FileUploadReceipt);
  rpc PublishUpload(FileUploadLookup) returns (FileUploadReceipt);
  rpc DiscardUpload(FileUploadLookup) returns (FileUploadReceipt);
  rpc GetUploadStatus(FileUploadLookup) returns (FileUploadReceipt);
}

// File mutations are separate method capabilities, not arbitrary commands.
enum FileOperationKind {
  FILE_OPERATION_KIND_UNSPECIFIED = 0;
  FILE_OPERATION_KIND_CREATE_DIRECTORY = 1;
  FILE_OPERATION_KIND_COPY_FILE = 2;
  FILE_OPERATION_KIND_MOVE_FILE = 3;
  FILE_OPERATION_KIND_SET_PERMISSIONS = 4;
}
message FileOperationCommand {
  FileOperationKind kind = 1;
  FileLocation source = 2;
  FileLocation target = 3;
  string expected_version = 4;
  string mode = 5;
}
message FileDirectoryIdentity { uint64 device = 1; uint64 inode = 2; }
message FileObjectIdentity {
  uint64 device = 1; uint64 inode = 2; uint32 mode = 3;
  uint32 owner_uid = 4; uint32 owner_gid = 5; uint64 link_count = 6;
  int64 size_bytes = 7; int64 modified_at_unix_ns = 8;
}
message FileOperationPlan {
  FileOperationCommand command = 1;
  FileObjectIdentity source_identity = 2;
  FileDirectoryIdentity source_parent = 3;
  FileDirectoryIdentity target_parent = 4;
  int64 size_bytes = 5;
  string sha256 = 6;
  string fingerprint = 7;
}
message FileOperationPlanRequest { FileOperationCommand command = 1; RequestContext context = 2; }
message FileOperationApplyRequest {
  string operation_id = 1; string owner = 2;
  FileOperationPlan plan = 3; RequestContext context = 4;
}
message FileOperationLookup { string operation_id = 1; string owner = 2; }
message FileOperationReceipt {
  string operation_id = 1; FileOperationKind kind = 2; string state = 3;
  string fingerprint = 4; string version = 5; int64 size_bytes = 6;
  string sha256 = 7; bool source_retained = 8; bool binding_current = 9;
}
service FileOperationService {
  rpc Plan(FileOperationPlanRequest) returns (FileOperationPlan);
  rpc Apply(FileOperationApplyRequest) returns (FileOperationReceipt);
  rpc Inspect(FileOperationLookup) returns (FileOperationReceipt);
  // Durable cancellation tombstone, including before a delayed Apply arrives.
  rpc Discard(FileOperationApplyRequest) returns (FileOperationReceipt);
}

// Dedicated history/trash capability; never changes old signed mutation plans.
enum FileArchiveKind {
  FILE_ARCHIVE_KIND_UNSPECIFIED = 0;
  FILE_ARCHIVE_KIND_TRASH = 1;
  FILE_ARCHIVE_KIND_RESTORE = 2;
  FILE_ARCHIVE_KIND_PURGE = 3;
}
message FileHistoryRequest {
  FileLocation location = 1; string after = 2; uint32 take = 3;
  string expected_version = 4;
}
message FileVersionRecord {
  string version_id = 1; FileLocation location = 2; string source_version = 3;
  int64 size_bytes = 4; string sha256 = 5; int64 created_at_unix_ms = 6;
  string capture_kind = 7; string capture_state = 8; string availability = 9;
  bool different_source_device = 10;
}
message FileHistoryPage {
  repeated FileVersionRecord entries = 1; string next_cursor = 2;
  string version = 3; uint32 scanned = 4; uint32 invalid_records = 5;
  bool complete = 6;
}
message FileArchiveCommand {
  FileArchiveKind kind = 1; FileLocation location = 2;
  string version_id = 3; string expected_version = 4;
}
message FileArchiveIdentity {
  string metadata_hash = 1; FileObjectIdentity data_identity = 2;
}
message FileArchivePlan {
  FileArchiveCommand command = 1; FileDirectoryIdentity parent_identity = 2;
  FileObjectIdentity source_identity = 3; string source_sha256 = 4;
  FileArchiveIdentity archive_identity = 5; FileObjectIdentity restore_metadata = 6;
  int64 size_bytes = 7; string sha256 = 8; string fingerprint = 9;
}
message FileArchivePlanRequest { FileArchiveCommand command = 1; RequestContext context = 2; }
message FileArchiveApplyRequest {
  string operation_id = 1; string owner = 2; FileArchivePlan plan = 3;
  RequestContext context = 4;
}
message FileArchiveLookup { string operation_id = 1; string owner = 2; }
message FileArchiveReceipt {
  string operation_id = 1; FileArchiveKind kind = 2; string state = 3;
  string fingerprint = 4; string version = 5; int64 size_bytes = 6;
  string sha256 = 7; bool source_retained = 8; bool binding_current = 9;
  string version_id = 10; FileHddBackupProof hdd_backup = 11;
}
service FileArchiveService {
  rpc List(FileHistoryRequest) returns (FileHistoryPage);
  rpc Plan(FileArchivePlanRequest) returns (FileArchivePlan);
  rpc Apply(FileArchiveApplyRequest) returns (FileArchiveReceipt);
  rpc Inspect(FileArchiveLookup) returns (FileArchiveReceipt);
  rpc Discard(FileArchiveApplyRequest) returns (FileArchiveReceipt);
}

// Dedicated directory protocol; never changes old signed regular-file plans.
// The complete bounded manifest stays at the Agent. No large JSON frame or
// arbitrary host path, UID, executable or archive command crosses this RPC.
message FileTreeCopyCommand {
  FileLocation source = 1; string expected_version = 2; FileLocation target = 3;
}
message FileTreeCopyPlan {
  FileTreeCopyCommand command = 1; string manifest_sha256 = 2;
  uint32 entry_count = 3; int64 total_bytes = 4;
  FileDirectoryIdentity target_parent = 5;
  string source_policy_hash = 6; string target_policy_hash = 7;
  string fingerprint = 8;
}
message FileTreeCopyPlanRequest { FileTreeCopyCommand command = 1; RequestContext context = 2; }
message FileTreeCopyApplyRequest {
  string operation_id = 1; string owner = 2;
  FileTreeCopyPlan plan = 3; RequestContext context = 4;
}
message FileTreeCopyLookup { string operation_id = 1; string owner = 2; }
message FileTreeCopyReceipt {
  string operation_id = 1; string state = 2; string fingerprint = 3;
  uint32 entry_count = 4; int64 total_bytes = 5;
  string version = 6; bool partial_retained = 7;
}
service FileTreeCopyService {
  rpc Plan(FileTreeCopyPlanRequest) returns (FileTreeCopyPlan);
  rpc Apply(FileTreeCopyApplyRequest) returns (FileTreeCopyReceipt);
  rpc Inspect(FileTreeCopyLookup) returns (FileTreeCopyReceipt);
  rpc Discard(FileTreeCopyApplyRequest) returns (FileTreeCopyReceipt);
}

// Independent move intent: copy to a new target, retain original source leaves,
// remove only empty source directories. Never reinterpret old copy plans.
message FileTreeMovePlan {
  FileTreeCopyPlan copy_plan = 1; FileDirectoryIdentity source_parent = 2;
  string fingerprint = 3;
}
message FileTreeMovePlanRequest { FileTreeCopyCommand command = 1; RequestContext context = 2; }
message FileTreeMoveApplyRequest {
  string operation_id = 1; string owner = 2; FileTreeMovePlan plan = 3;
  RequestContext context = 4;
}
message FileTreeMoveLookup { string operation_id = 1; string owner = 2; }
message FileTreeMoveReceipt {
  string operation_id = 1; string state = 2; string fingerprint = 3;
  uint32 entry_count = 4; int64 total_bytes = 5; string version = 6;
  bool destination_published = 7; bool source_removed = 8;
  // Original file leaves are retained privately; empty directory metadata is
  // represented by the verified manifest. This is not an HDD backup proof.
  bool source_retained = 9; bool partial_retained = 10;
}
service FileTreeMoveService {
  rpc Plan(FileTreeMovePlanRequest) returns (FileTreeMovePlan);
  rpc Apply(FileTreeMoveApplyRequest) returns (FileTreeMoveReceipt);
  rpc Inspect(FileTreeMoveLookup) returns (FileTreeMoveReceipt);
  rpc Discard(FileTreeMoveApplyRequest) returns (FileTreeMoveReceipt);
}

// Independent compression intent. Only registered source/target locations;
// manifests stay at the Agent. Old file/copy/move contracts are unchanged.
message FileTreePackingCommand { FileTreeCopyCommand tree = 1; string format = 2; }
message FileTreePackingPlan {
  FileTreePackingCommand command = 1; string manifest_sha256 = 2;
  uint32 entry_count = 3; int64 total_bytes = 4;
  FileDirectoryIdentity target_parent = 5;
  string source_policy_hash = 6; string target_policy_hash = 7;
  string fingerprint = 8;
}
message FileTreePackingPlanRequest { FileTreePackingCommand command = 1; RequestContext context = 2; }
message FileTreePackingApplyRequest {
  string operation_id = 1; string owner = 2;
  FileTreePackingPlan plan = 3; RequestContext context = 4;
}
message FileTreePackingLookup { string operation_id = 1; string owner = 2; }
message FileTreePackingDownloadRequest {
  string operation_id = 1; string owner = 2; RequestContext context = 3;
}
message FileTreePackingReceipt {
  string operation_id = 1; string state = 2; string fingerprint = 3;
  string format = 4; uint32 entry_count = 5; int64 total_bytes = 6;
  int64 archive_bytes = 7; string archive_sha256 = 8;
  string version = 9; bool partial_retained = 10;
}
service FileTreePackingService {
  rpc Plan(FileTreePackingPlanRequest) returns (FileTreePackingPlan);
  rpc Apply(FileTreePackingApplyRequest) returns (FileTreePackingReceipt);
  rpc Inspect(FileTreePackingLookup) returns (FileTreePackingReceipt);
  rpc Discard(FileTreePackingApplyRequest) returns (FileTreePackingReceipt);
  // At most 17 GiB and 32 KiB/chunk, bound to a completed exact receipt.
  // Does not enlarge the old general-file 1 GiB download capability.
  rpc Download(FileTreePackingDownloadRequest) returns (stream FileDownloadFrame);
}

// Distinct archive -> new-directory publication. No overwrite, source deletion,
// user-supplied executable, UID/GID, or complete member list crosses this RPC.
message FileTreeUnpackingCommand { FileTreeCopyCommand tree = 1; string format = 2; }
message FileTreeUnpackingPlan {
  FileTreeUnpackingCommand command = 1; string archive_sha256 = 2;
  int64 archive_bytes = 3; string content_sha256 = 4;
  uint32 entry_count = 5; int64 total_bytes = 6;
  FileDirectoryIdentity target_parent = 7;
  string source_policy_hash = 8; string target_policy_hash = 9;
  string fingerprint = 10;
}
message FileTreeUnpackingPlanRequest { FileTreeUnpackingCommand command = 1; RequestContext context = 2; }
message FileTreeUnpackingApplyRequest {
  string operation_id = 1; string owner = 2;
  FileTreeUnpackingPlan plan = 3; RequestContext context = 4;
}
message FileTreeUnpackingLookup { string operation_id = 1; string owner = 2; }
message FileTreeUnpackingReceipt {
  string operation_id = 1; string state = 2; string fingerprint = 3;
  string format = 4; uint32 entry_count = 5; int64 total_bytes = 6;
  // These describe the unchanged input archive even on Aborted/Unknown.
  int64 archive_bytes = 7; string archive_sha256 = 8;
  string version = 9; bool partial_retained = 10;
}
service FileTreeUnpackingService {
  rpc Plan(FileTreeUnpackingPlanRequest) returns (FileTreeUnpackingPlan);
  rpc Apply(FileTreeUnpackingApplyRequest) returns (FileTreeUnpackingReceipt);
  rpc Inspect(FileTreeUnpackingLookup) returns (FileTreeUnpackingReceipt);
  rpc Discard(FileTreeUnpackingApplyRequest) returns (FileTreeUnpackingReceipt);
}

// Complete HDD capture must be verified before the original directory is
// retained privately. No caller-selected executable, UID/GID or member list.
message FileTreeRecyclingCommand { FileLocation source = 1; string expected_version = 2; }
message FileTreeRecyclingPlan {
  FileTreeRecyclingCommand command = 1;
  FileDirectoryIdentity source_parent = 2;
  string source_policy_hash = 3; string manifest_sha256 = 4;
  uint32 entry_count = 5; int64 total_bytes = 6; string fingerprint = 7;
}
message FileTreeRecyclingPlanRequest { FileTreeRecyclingCommand command = 1; RequestContext context = 2; }
message FileTreeRecyclingApplyRequest {
  string operation_id = 1; string owner = 2;
  FileTreeRecyclingPlan plan = 3; RequestContext context = 4;
}
message FileTreeRecyclingLookup { string operation_id = 1; string owner = 2; }
message FileTreeRecyclingReceipt {
  string operation_id = 1; string state = 2; string fingerprint = 3;
  string capture_id = 4; string manifest_sha256 = 5;
  uint32 entry_count = 6; int64 total_bytes = 7;
  bool capture_verified = 8; bool capture_may_be_retained = 9;
  // Zero/empty only when no verified capture proof is available.
  int64 archive_bytes = 10; string archive_sha256 = 11;
  bool source_may_have_changed = 12; bool source_removed = 13;
  bool originals_retained = 14;
}
service FileTreeRecyclingService {
  rpc Plan(FileTreeRecyclingPlanRequest) returns (FileTreeRecyclingPlan);
  rpc Apply(FileTreeRecyclingApplyRequest) returns (FileTreeRecyclingReceipt);
  rpc Inspect(FileTreeRecyclingLookup) returns (FileTreeRecyclingReceipt);
  rpc Discard(FileTreeRecyclingApplyRequest) returns (FileTreeRecyclingReceipt);
}

// Restore a verified private capture to an absent registered destination.
// capture_owner identifies the original resource, never the current actor.
// It is resolved from trusted capture metadata by the application workflow.
// No private storage path, executable, UID/GID or member list is accepted.
message FileTreeRestoringCommand {
  FileLocation source = 1; string expected_version = 2;
  FileLocation target = 3; string capture_id = 4;
  string capture_owner = 5; string capture_kind = 6; string manifest_sha256 = 7;
}
message FileTreeRestoringPlan {
  FileTreeRestoringCommand command = 1; string archive_sha256 = 2;
  int64 archive_bytes = 3; string content_sha256 = 4;
  uint32 entry_count = 5; int64 total_bytes = 6;
  FileDirectoryIdentity target_parent = 7;
  string source_policy_hash = 8; string target_policy_hash = 9;
  string fingerprint = 10;
}
message FileTreeRestoringPlanRequest { FileTreeRestoringCommand command = 1; RequestContext context = 2; }
message FileTreeRestoringApplyRequest {
  string operation_id = 1; string owner = 2;
  FileTreeRestoringPlan plan = 3; RequestContext context = 4;
}
message FileTreeRestoringLookup { string operation_id = 1; string owner = 2; }
message FileTreeRestoringReceipt {
  string operation_id = 1; string state = 2; string fingerprint = 3;
  string format = 4; uint32 entry_count = 5; int64 total_bytes = 6;
  int64 archive_bytes = 7; string archive_sha256 = 8;
  string version = 9; bool partial_retained = 10;
  string kind = 11; string capture_id = 12;
}
service FileTreeRestoringService {
  rpc Plan(FileTreeRestoringPlanRequest) returns (FileTreeRestoringPlan);
  rpc Apply(FileTreeRestoringApplyRequest) returns (FileTreeRestoringReceipt);
  rpc Inspect(FileTreeRestoringLookup) returns (FileTreeRestoringReceipt);
  rpc Discard(FileTreeRestoringApplyRequest) returns (FileTreeRestoringReceipt);
}

// Separate destructive capability; ordinary absent-target restoration cannot
// authorize overwrite. Both the historical capture and current live target
// are bound. The displaced tree is archived and retained, never deleted.
message FileTreeOverwriteRestoringCommand {
  FileLocation source = 1; string expected_version = 2;
  FileLocation target = 3; string capture_id = 4;
  string capture_owner = 5; string capture_kind = 6; string manifest_sha256 = 7;
  string target_expected_version = 8;
}
message FileTreeOverwriteRestoringPlan {
  FileTreeOverwriteRestoringCommand command = 1; string archive_sha256 = 2;
  int64 archive_bytes = 3; string content_sha256 = 4;
  uint32 entry_count = 5; int64 total_bytes = 6;
  FileDirectoryIdentity target_parent = 7;
  string source_policy_hash = 8; string target_policy_hash = 9;
  string fingerprint = 10;
  string target_manifest_sha256 = 11; string target_tree_sha256 = 12;
  uint32 target_entry_count = 13; int64 target_total_bytes = 14;
  FileDirectoryIdentity target_identity = 15;
  // Archive-content domain, distinct from the identity-bearing target tree hash.
  string target_content_sha256 = 16;
}
message FileTreeOverwriteRestoringPlanRequest { FileTreeOverwriteRestoringCommand command = 1; RequestContext context = 2; }
message FileTreeOverwriteRestoringApplyRequest {
  string operation_id = 1; string owner = 2;
  FileTreeOverwriteRestoringPlan plan = 3; RequestContext context = 4;
}
message FileTreeOverwriteRestoringLookup { string operation_id = 1; string owner = 2; }
message FileTreeOverwriteRestoringReceipt {
  string operation_id = 1; string state = 2; string fingerprint = 3;
  string format = 4; uint32 entry_count = 5; int64 total_bytes = 6;
  int64 archive_bytes = 7; string archive_sha256 = 8;
  string version = 9; bool partial_retained = 10;
  string kind = 11; string capture_id = 12;
  string overwritten_capture_id = 13; bool backup_may_be_retained = 14;
  bool backup_verified = 15; bool originals_retained = 16;
  bool target_may_have_changed = 17;
  // Zero/empty only when no verified displaced-tree capture proof exists.
  int64 backup_archive_bytes = 18; string backup_archive_sha256 = 19;
}
service FileTreeOverwriteRestoringService {
  rpc Plan(FileTreeOverwriteRestoringPlanRequest) returns (FileTreeOverwriteRestoringPlan);
  rpc Apply(FileTreeOverwriteRestoringApplyRequest) returns (FileTreeOverwriteRestoringReceipt);
  rpc Inspect(FileTreeOverwriteRestoringLookup) returns (FileTreeOverwriteRestoringReceipt);
  rpc Discard(FileTreeOverwriteRestoringApplyRequest) returns (FileTreeOverwriteRestoringReceipt);
}

// Separate irreversible payload deletion capability. Capture ownership is a
// resource binding resolved by the application, never the current actor.
// No caller-selected private paths, shell, member list or UID/GID is accepted.
enum FileTreePurgeScope {
  FILE_TREE_PURGE_SCOPE_UNSPECIFIED = 0;
  FILE_TREE_PURGE_SCOPE_ARCHIVE = 1;
  FILE_TREE_PURGE_SCOPE_ORIGINALS = 2;
  FILE_TREE_PURGE_SCOPE_ALL = 3;
}
message FileTreePurgingCommand {
  FileLocation source = 1; string expected_version = 2;
  string capture_id = 3; string capture_owner = 4;
  string capture_kind = 5; string manifest_sha256 = 6;
  FileTreePurgeScope scope = 7;
}
message FileTreePurgingPlan {
  FileTreePurgingCommand command = 1; string source_policy_hash = 2;
  // Absent for archive-only cleanup: the old parent need not exist.
  FileDirectoryIdentity source_parent = 3;
  string storage_hash = 4; FileDirectoryIdentity store_identity = 5;
  string capture_metadata_hash = 6; string origin_receipt_hash = 7;
  string manifest_file_sha256 = 8; FileDirectoryIdentity archive_identity = 9;
  int64 archive_bytes = 10; string archive_sha256 = 11;
  string content_sha256 = 12; uint32 entry_count = 13; int64 total_bytes = 14;
  FileDirectoryIdentity retained_identity = 15;
  FileDirectoryIdentity staging_identity = 16;
  optional string retained_tree_sha256 = 17;
  string fingerprint = 18;
}
message FileTreePurgingPlanRequest { FileTreePurgingCommand command = 1; RequestContext context = 2; }
message FileTreePurgingApplyRequest {
  string operation_id = 1; string owner = 2;
  FileTreePurgingPlan plan = 3; RequestContext context = 4;
}
message FileTreePurgingLookup { string operation_id = 1; string owner = 2; }
message FileTreePurgingReceipt {
  string operation_id = 1; string kind = 2; string state = 3;
  string fingerprint = 4; string capture_id = 5; FileTreePurgeScope scope = 6;
  uint32 entry_count = 7; int64 total_bytes = 8; int64 archive_bytes = 9;
  bool deletion_started = 10; bool archive_removed = 11; bool originals_removed = 12;
}
service FileTreePurgingService {
  rpc Plan(FileTreePurgingPlanRequest) returns (FileTreePurgingPlan);
  rpc Apply(FileTreePurgingApplyRequest) returns (FileTreePurgingReceipt);
  rpc Inspect(FileTreePurgingLookup) returns (FileTreePurgingReceipt);
  rpc Discard(FileTreePurgingApplyRequest) returns (FileTreePurgingReceipt);
}

// Non-recursive ordinary chmod. Root attests the original inode and HDD metadata.
// No caller-selected owner, recursive traversal or ACL/xattr mutation.
message ContainerPermissionCommand {
  ContainerFileLocation location = 1; string mode = 2; string expected_version = 3;
}
message ContainerPermissionPlan {
  uint32 schema_version = 1; ContainerPermissionCommand command = 2; string target_proof = 3;
  FileDirectoryIdentity parent_identity = 4; string parent_version = 5;
  uint32 owner_uid = 6; uint32 owner_gid = 7; string fingerprint = 8;
  string kind = 9; FileObjectIdentity source_identity = 10; int64 source_changed_at_unix_ns = 11;
  string attributes_digest = 12; bool no_change = 13;
}
message ContainerPermissionPlanRequest { ContainerPermissionCommand command = 1; RequestContext context = 2; }
message ContainerPermissionRequest {
  string operation_id = 1; string owner = 2; ContainerPermissionPlan plan = 3; RequestContext context = 4;
}
message ContainerPermissionReceipt {
  string operation_id = 1; string container_id = 2; string instance_id = 3; string fingerprint = 4;
  string target_proof = 5; string state = 6; string version = 7; bool binding_current = 8; bool replayed = 9;
  string kind = 10; optional bool mode_confirmed = 11; bool no_change = 12;
  bool history_may_exist = 13; bool history_verified = 14; string history_digest = 15;
}
service ContainerPermissionService {
  rpc Plan(ContainerPermissionPlanRequest) returns (ContainerPermissionPlan);
  rpc Apply(ContainerPermissionRequest) returns (ContainerPermissionReceipt);
  rpc Inspect(ContainerPermissionRequest) returns (ContainerPermissionReceipt);
  rpc Discard(ContainerPermissionRequest) returns (ContainerPermissionReceipt);
}

// Dedicated ordinary-file Trash authority. Restore references the original Root
// record but carries a new job context. Unknown source facts stay unproved.
message ContainerRecycleAttribute { string name = 1; bytes value = 2; }
message ContainerRecycleCommand { ContainerFileLocation location = 1; string expected_version = 2; }
message ContainerRecyclePlan {
  uint32 schema_version = 1; ContainerRecycleCommand command = 2; string target_proof = 3;
  FileDirectoryIdentity parent_identity = 4; string parent_version = 5;
  uint32 owner_uid = 6; uint32 owner_gid = 7; string fingerprint = 8;
  FileObjectIdentity source_identity = 9; int64 source_changed_at_unix_ns = 10;
  string sha256 = 11; repeated ContainerRecycleAttribute attributes = 12;
}
message ContainerRecyclePlanRequest { ContainerRecycleCommand command = 1; RequestContext context = 2; }
message ContainerRecycleRequest {
  string operation_id = 1; string owner = 2; ContainerRecyclePlan plan = 3; RequestContext context = 4;
}
message ContainerRecycleReceipt {
  string operation_id = 1; string container_id = 2; string instance_id = 3;
  string fingerprint = 4; string target_proof = 5; string state = 6;
  bool binding_current = 7; bool replayed = 8;
  bool history_may_exist = 9; bool history_verified = 10; string history_digest = 11;
  bool history_available = 12; optional bool source_retained = 13; optional bool source_restored = 14;
}
service ContainerRecycleService {
  rpc Plan(ContainerRecyclePlanRequest) returns (ContainerRecyclePlan);
  rpc Apply(ContainerRecycleRequest) returns (ContainerRecycleReceipt);
  rpc Inspect(ContainerRecycleRequest) returns (ContainerRecycleReceipt);
  rpc Discard(ContainerRecycleRequest) returns (ContainerRecycleReceipt);
  rpc Restore(ContainerRecycleRequest) returns (ContainerRecycleReceipt);
}

// Independent restore intent. Source context never replaces the new job context.
message ContainerRecycleRestoreSource { string operation_id = 1; string owner = 2; ContainerRecyclePlan plan = 3; }
message ContainerRecycleRestoreCommand { ContainerRecycleRestoreSource source = 1; string history_digest = 2; }
message ContainerRecycleRestorePlan {
  uint32 schema_version = 1; ContainerRecycleRestoreCommand command = 2; string target_proof = 3;
  FileDirectoryIdentity parent_identity = 4; string parent_version = 5; uint32 owner_uid = 6; uint32 owner_gid = 7;
  FileDirectoryIdentity private_identity = 8; FileObjectIdentity retained_identity = 9; int64 retained_changed_at_unix_ns = 10; string fingerprint = 11;
}
message ContainerRecycleRestorePlanRequest { ContainerRecycleRestoreCommand command = 1; RequestContext context = 2; }
message ContainerRecycleRestoreRequest { string operation_id = 1; string owner = 2; ContainerRecycleRestorePlan plan = 3; RequestContext context = 4; }
message ContainerRecycleRestoreReceipt {
  string operation_id = 1; string source_operation_id = 2; string fingerprint = 3; string target_proof = 4; string state = 5;
  bool binding_current = 6; bool replayed = 7; bool history_verified = 8; string history_digest = 9; bool history_available = 10;
  optional string source_state = 11; optional bool source_retained = 12; optional bool source_restored = 13; optional bool restored_by_this_operation = 14;
}
service ContainerRecycleRestoreService {
  rpc Plan(ContainerRecycleRestorePlanRequest) returns (ContainerRecycleRestorePlan);
  rpc Apply(ContainerRecycleRestoreRequest) returns (ContainerRecycleRestoreReceipt);
  rpc Inspect(ContainerRecycleRestoreRequest) returns (ContainerRecycleRestoreReceipt);
  rpc Discard(ContainerRecycleRestoreRequest) returns (ContainerRecycleRestoreReceipt);
}

// Originals-only retained-file purge. Archive data is retained; no caller paths.
message ContainerRecyclePurgeSource { string operation_id = 1; string owner = 2; ContainerRecyclePlan plan = 3; }
message ContainerRecyclePurgeCommand { ContainerRecyclePurgeSource source = 1; string history_digest = 2; string scope = 3; }
message ContainerRecyclePurgePlan {
  uint32 schema_version = 1; ContainerRecyclePurgeCommand command = 2; string target_proof = 3;
  FileDirectoryIdentity parent_identity = 4; string parent_version = 5; uint32 owner_uid = 6; uint32 owner_gid = 7;
  FileDirectoryIdentity private_identity = 8; FileObjectIdentity retained_identity = 9; int64 retained_changed_at_unix_ns = 10;
  string source_record_digest = 11; string history_metadata_digest = 12; int64 history_created_at_unix_ms = 13;
  string storage_hash = 14; FileDirectoryIdentity store_identity = 15; FileObjectIdentity archive_identity = 16;
  int64 archive_changed_at_unix_ns = 17; int64 archive_bytes = 18; string archive_sha256 = 19; string fingerprint = 20;
}
message ContainerRecyclePurgePlanRequest { ContainerRecyclePurgeCommand command = 1; RequestContext context = 2; }
message ContainerRecyclePurgeRequest { string operation_id = 1; string owner = 2; ContainerRecyclePurgePlan plan = 3; RequestContext context = 4; }
message ContainerRecyclePurgeReceipt {
  string operation_id = 1; string source_operation_id = 2; string fingerprint = 3; string state = 4;
  bool source_fenced = 5; bool owned_fence = 6; optional bool purge_applied = 7;
}
service ContainerRecyclePurgeService {
  rpc Plan(ContainerRecyclePurgePlanRequest) returns (ContainerRecyclePurgePlan);
  rpc Reserve(ContainerRecyclePurgeRequest) returns (ContainerRecyclePurgeReceipt);
  rpc Apply(ContainerRecyclePurgeRequest) returns (ContainerRecyclePurgeReceipt);
  rpc Inspect(ContainerRecyclePurgeRequest) returns (ContainerRecyclePurgeReceipt);
  rpc Discard(ContainerRecyclePurgeRequest) returns (ContainerRecyclePurgeReceipt);
}

// Non-recursive explicit numeric ownership. No implicit root, mode or ACL writes.
message ContainerOwnershipCommand {
  ContainerFileLocation location = 1; optional uint32 uid = 2; optional uint32 gid = 3; string expected_version = 4;
}
message ContainerOwnershipPlan {
  uint32 schema_version = 1; ContainerOwnershipCommand command = 2; string target_proof = 3;
  FileDirectoryIdentity parent_identity = 4; string parent_version = 5;
  uint32 owner_uid = 6; uint32 owner_gid = 7; string fingerprint = 8;
  string kind = 9; FileObjectIdentity source_identity = 10; int64 source_changed_at_unix_ns = 11;
  string attributes_digest = 12; bool no_change = 13;
}
message ContainerOwnershipPlanRequest { ContainerOwnershipCommand command = 1; RequestContext context = 2; }
message ContainerOwnershipRequest {
  string operation_id = 1; string owner = 2; ContainerOwnershipPlan plan = 3; RequestContext context = 4;
}
message ContainerOwnershipReceipt {
  string operation_id = 1; string container_id = 2; string instance_id = 3; string fingerprint = 4;
  string target_proof = 5; string state = 6; string version = 7; bool binding_current = 8; bool replayed = 9;
  string kind = 10; optional bool owner_confirmed = 11; bool no_change = 12;
  bool history_may_exist = 13; bool history_verified = 14; string history_digest = 15;
}
service ContainerOwnershipService {
  rpc Plan(ContainerOwnershipPlanRequest) returns (ContainerOwnershipPlan);
  rpc Apply(ContainerOwnershipRequest) returns (ContainerOwnershipReceipt);
  rpc Inspect(ContainerOwnershipRequest) returns (ContainerOwnershipReceipt);
  rpc Discard(ContainerOwnershipRequest) returns (ContainerOwnershipReceipt);
