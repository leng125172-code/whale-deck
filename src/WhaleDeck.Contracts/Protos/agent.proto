syntax = "proto3";

option csharp_namespace = "WhaleDeck.Contracts.Agent.V1";
package whaledeck.agent.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

message RequestContext {
  string trace_id = 1;
  string actor_subject = 2;
  string job_id = 3;
  string idempotency_key = 4;
  bytes capability = 5;
}

message ResourceReference {
  string resource_id = 1;
  string resource_type = 2;
}

enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_QUEUED = 1;
  OPERATION_STATE_RUNNING = 2;
  OPERATION_STATE_WAITING_FOR_HEALTH = 3;
  OPERATION_STATE_SUCCEEDED = 4;
  OPERATION_STATE_FAILED = 5;
  OPERATION_STATE_ROLLING_BACK = 6;
  OPERATION_STATE_ROLLED_BACK = 7;
  OPERATION_STATE_CANCELED = 8;
}

message OperationHandle {
  string operation_id = 1;
  OperationState state = 2;
  string phase = 3;
  int32 progress_percent = 4;
  string error_code = 5;
  // Structured, non-secret operation result. Sensitive values must continue
  // to use the one-time secret store and never appear here.
  string result_json = 6;
}

message OperationRequest {
  RequestContext context = 1;
  string operation_id = 2;
}

message CapabilitiesResponse {
  string agent_version = 1;
  uint32 protocol_major = 2;
  uint32 protocol_minor = 3;
  string operating_system = 4;
  repeated string capabilities = 5;
}

message HealthResponse {
  bool healthy = 1;
  bool docker_available = 2;
  bool systemd_available = 3;
  string status = 4;
  google.protobuf.Timestamp observed_at_utc = 5;
}

message HostInfoResponse {
  string host_name = 1;
  string distribution = 2;
  string kernel_version = 3;
  string architecture = 4;
  int64 boot_time_unix_seconds = 5;
  int64 uptime_seconds = 6;
  uint32 logical_processor_count = 7;
  uint64 total_memory_bytes = 8;
  repeated HostAddress addresses = 9;
}

message HostAddress {
  string interface_name = 1;
  string address = 2;
}

message MetricsRequest {
  RequestContext context = 1;
  // Zero requests one batch and closes the stream. Values from 6 through 60
  // keep the stream open at the requested sampling interval.
  uint32 interval_seconds = 2;
}

message MetricPoint {
  string metric_kind = 1;
  string device_id = 2;
  double value = 3;
  string unit = 4;
  string quality = 5;
  google.protobuf.Timestamp sampled_at_utc = 6;
}

message JournalRequest {
  string unit = 1;
  uint32 take = 2;
  uint32 since_minutes = 3;
  string priority = 4;
  string keyword = 5;
}

message JournalEntry {
  google.protobuf.Timestamp occurred_at_utc = 1;
  string unit = 2;
  string priority = 3;
  string process = 4;
  int32 process_id = 5;
  string message = 6;
}

message JournalResponse {
  repeated JournalEntry entries = 1;
}

message DiagnosticBundleRequest {
  string bundle_id = 1;
}

message DiagnosticBundleChunk {
  bytes content = 1;
}

message DockerInfoResponse {
  string server_version = 1;
  string api_version = 2;
  string operating_system = 3;
  string architecture = 4;
  int32 containers = 5;
  int32 images = 6;
  string logging_driver = 7;
}

message ListContainersRequest {
  RequestContext context = 1;
  bool include_stopped = 2;
}

message ContainerSummary {
  string id = 1;
  string name = 2;
  string image = 3;
  string state = 4;
  string status = 5;
  bool protected_resource = 6;
  string protection_level = 7;
  map<string, string> labels = 8;
  repeated string ports = 9;
  repeated string networks = 10;
  repeated string addresses = 11;
  google.protobuf.Timestamp created_at_utc = 12;
  string image_id = 13;
  repeated string volume_names = 14;
  repeated string network_ids = 15;
}

message ListContainersResponse {
  repeated ContainerSummary containers = 1;
}

message ContainerLogsRequest {
  string container_id = 1;
  uint32 tail = 2;
  uint32 since_minutes = 3;
}

message ContainerLogsResponse {
  repeated string lines = 1;
  bool truncated = 2;
}

message ContainerStatsResponse {
  map<string, string> values = 1;
}

message ContainerUsageSnapshot {
  string container_id = 1;
  string state = 2;
  google.protobuf.Timestamp sampled_at_utc = 3;
  optional double cpu_percent = 4;
  double cpu_window_seconds = 5;
  optional uint64 memory_used_bytes = 6;
  optional uint64 memory_limit_bytes = 7;
  optional double memory_percent = 8;
  optional uint64 network_receive_bytes = 9;
  optional uint64 network_send_bytes = 10;
  optional uint64 block_read_bytes = 11;
  optional uint64 block_write_bytes = 12;
  optional uint64 pids = 13;
  string quality = 14;
}

message ContainerUsageBatch {
  repeated ContainerUsageSnapshot items = 1;
  google.protobuf.Timestamp sampled_at_utc = 2;
  bool is_stale = 3;
  bool is_truncated = 4;
  int32 skipped_count = 5;
  int32 total_count = 6;
  int32 interval_seconds = 7;
}

message DockerEventsRequest {
  int64 since_unix_seconds = 1;
  uint32 take = 2;
}

message DockerEvent {
  string fingerprint = 1;
  google.protobuf.Timestamp occurred_at_utc = 2;
  string event_type = 3;
  string action = 4;
  string resource_id = 5;
  string resource_name = 6;
  string image = 7;
  map<string, string> attributes = 8;
}

message DockerEventsResponse {
  repeated DockerEvent events = 1;
}

message ContainerInspectResponse {
  string id = 1;
  string name = 2;
  string image = 3;
  repeated string environment_names = 4;
  repeated string command = 5;
  repeated string entrypoint = 6;
  map<string, string> labels = 7;
  repeated string ports = 8;
  repeated string volumes = 9;
  repeated string networks = 10;
  string restart_policy = 11;
  double cpus = 12;
  int64 memory_mb = 13;
  repeated string health_command = 14;
  int64 health_interval_seconds = 15;
  int64 health_timeout_seconds = 16;
  int64 health_retries = 17;
  ContainerRelationships relationships = 18;
}

// Read-only, bounded native metadata. No environment values, driver options or arbitrary configuration.
message ContainerRelationships {
  string image_id = 1;
  string compose_project = 2;
  string compose_service = 3;
  string network_mode = 4;
  repeated ContainerNetworkEndpoint endpoints = 5;
  repeated ContainerMount mounts = 6;
  repeated ContainerPortBinding port_bindings = 7;
  bool is_truncated = 8;
}
message ContainerNetworkEndpoint {
  string name = 1;
  string network_id = 2;
  string ipv4_address = 3;
  int64 ipv4_prefix_length = 4;
  string ipv4_gateway = 5;
  string ipv6_address = 6;
  int64 ipv6_prefix_length = 7;
  string ipv6_gateway = 8;
  string mac_address = 9;
}
message ContainerMount {
  string type = 1;
  string name = 2;
  string source = 3;
  string destination = 4;
  bool read_write = 5;
}
message ContainerPortBinding {
  string container_port = 1;
  string host_address = 2;
  string host_port = 3;
  bool published = 4;
}

message ImageMetadataRequest {
  RequestContext context = 1;
  string image = 2;
  bool pull_if_missing = 3;
}

message ImageMetadataResponse {
  string image = 1;
  string image_id = 2;
  repeated string environment = 3;
  repeated string exposed_ports = 4;
  repeated string volumes = 5;
  repeated string entrypoint = 6;
  repeated string command = 7;
  map<string, string> labels = 8;
}

enum ContainerAction {
  CONTAINER_ACTION_UNSPECIFIED = 0;
  CONTAINER_ACTION_START = 1;
  CONTAINER_ACTION_STOP = 2;
  CONTAINER_ACTION_RESTART = 3;
  CONTAINER_ACTION_DELETE = 4;
}

message ChangeContainerStateRequest {
  RequestContext context = 1;
  string container_id = 2;
  ContainerAction action = 3;
  uint32 timeout_seconds = 4;
  bool preserve_volumes = 5;
  string plan_hash = 6;
}

message RegisteredResourceRequest {
  RequestContext context = 1;
  ResourceReference resource = 2;
}

message ResourceCollectionResponse {
  repeated ResourceSnapshot resources = 1;
}

// Deliberately excludes existing environment values, command and entrypoint contents.
message ApplicationConfigurationResponse {
  string resource_id = 1;
  string fingerprint = 2;
  repeated ApplicationServiceConfiguration services = 3;
  repeated string environment_names = 4;
  bool auto_update = 5;
  string version_policy = 6;
  string maintenance_window = 7;
  repeated string dependencies = 8;
  repeated string approved_networks = 9;
  string owned_data_directory = 10;
}

message ApplicationServiceConfiguration {
  string name = 1;
  string image = 2;
  double cpus = 3;
  int64 memory_mb = 4;
  string restart_policy = 5;
  repeated string ports = 6;
  bool command_present = 7;
  bool entrypoint_present = 8;
  repeated string environment_names = 9;
  repeated ApplicationConfigurationMount mounts = 10;
  repeated string networks = 11;
  string network_mode = 12;
}

message ApplicationConfigurationMount {
  string type = 1;
  string source = 2;
  string target = 3;
  bool read_only = 4;
}

message ResourceSnapshot {
  string resource_id = 1;
  string display_name = 2;
  string resource_type = 3;
  string state = 4;
  string version = 5;
  bool protected_resource = 6;
  map<string, string> attributes = 7;
}

message RegisteredActionRequest {
  RequestContext context = 1;
  ResourceReference resource = 2;
  string action = 3;
  string plan_hash = 4;
  map<string, string> parameters = 5;
}

message PlanResponse {
  string plan_hash = 1;
  google.protobuf.Timestamp expires_at_utc = 2;
  repeated string changes = 3;
  repeated string warnings = 4;
}

message DockerSettingsResponse {
  string settings_json = 1;
  repeated string editable_keys = 2;
}

service AgentService {
  rpc GetCapabilities(google.protobuf.Empty) returns (CapabilitiesResponse);
  rpc GetHealth(google.protobuf.Empty) returns (HealthResponse);
  rpc WatchHealth(google.protobuf.Empty) returns (stream HealthResponse);
}

service OperationService {
  rpc GetOperation(OperationRequest) returns (OperationHandle);
  rpc GetMaintenanceStatus(google.protobuf.Empty) returns (OperationHandle);
  rpc CancelOperation(OperationRequest) returns (OperationHandle);
  rpc WatchOperation(OperationRequest) returns (stream OperationHandle);
}

service HostService {
  rpc GetHostInfo(google.protobuf.Empty) returns (HostInfoResponse);
  rpc StreamMetrics(MetricsRequest) returns (stream MetricPoint);
  rpc ListNetworkInterfaces(google.protobuf.Empty) returns (ResourceCollectionResponse);
  rpc ListStorageDevices(google.protobuf.Empty) returns (ResourceCollectionResponse);
  rpc QueryJournal(JournalRequest) returns (JournalResponse);
  rpc ListProcesses(HostProcessesRequest) returns (HostProcessesResponse);
  rpc GetProcess(HostProcessRequest) returns (HostProcessSnapshot);
  rpc RebootHost(RegisteredActionRequest) returns (OperationHandle);
}

message HostProcessesRequest {
  uint32 page = 1;
  uint32 page_size = 2;
  string sort = 3;
  bool descending = 4;
  string filter = 5;
}

message HostProcessRequest {
  int32 pid = 1;
  string instance_id = 2;
}

message HostProcessSnapshot {
  int32 pid = 1;
  int32 parent_pid = 2;
  uint32 user_id = 3;
  string instance_id = 4;
  string name = 5;
  string state = 6;
  int32 thread_count = 7;
  google.protobuf.Timestamp started_at_utc = 8;
  double cpu_time_seconds = 9;
  optional double cpu_percent = 10;
  int64 memory_bytes = 11;
  int64 virtual_memory_bytes = 12;
}

message HostProcessesResponse {
  repeated HostProcessSnapshot items = 1;
  int32 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
  google.protobuf.Timestamp sampled_at_utc = 5;
  double cpu_window_seconds = 6;
  bool is_stale = 7;
  bool is_truncated = 8;
  int32 skipped_count = 9;
}

service DockerService {
  rpc GetEngineInfo(google.protobuf.Empty) returns (DockerInfoResponse);
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);
  rpc GetContainerLogs(ContainerLogsRequest) returns (ContainerLogsResponse);
  rpc GetContainerStats(ResourceReference) returns (ContainerStatsResponse);
  rpc GetContainerUsage(google.protobuf.Empty) returns (ContainerUsageBatch);
  rpc ListEvents(DockerEventsRequest) returns (DockerEventsResponse);
  rpc InspectContainer(ResourceReference) returns (ContainerInspectResponse);
  rpc ChangeContainerState(ChangeContainerStateRequest) returns (OperationHandle);
  rpc ListImages(google.protobuf.Empty) returns (ResourceCollectionResponse);
  rpc ListNetworks(google.protobuf.Empty) returns (ResourceCollectionResponse);
  rpc ListVolumes(google.protobuf.Empty) returns (ResourceCollectionResponse);
  rpc InspectImage(ImageMetadataRequest) returns (ImageMetadataResponse);
  rpc PlanAction(RegisteredActionRequest) returns (PlanResponse);
  rpc RunAction(RegisteredActionRequest) returns (OperationHandle);
}

message BackupTargetCapacityResponse {
  string target_directory_id = 1;
  bool available = 2;
  int64 total_bytes = 3;
  int64 used_bytes = 4;
  int64 free_bytes = 5;
  google.protobuf.Timestamp observed_at_utc = 6;
  string error_code = 7;
}

service ManagedResourceService {
  rpc GetBackupTargetCapacity(google.protobuf.Empty) returns (BackupTargetCapacityResponse);
  rpc GetApplicationConfiguration(RegisteredResourceRequest) returns (ApplicationConfigurationResponse);
  rpc PlanAction(RegisteredActionRequest) returns (PlanResponse);
  rpc ListDatabaseInstances(google.protobuf.Empty) returns (ResourceCollectionResponse);
  rpc RunDatabaseAction(RegisteredActionRequest) returns (OperationHandle);
  rpc ListSystemdUnits(google.protobuf.Empty) returns (ResourceCollectionResponse);
  rpc RunSystemdAction(RegisteredActionRequest) returns (OperationHandle);
  rpc ListComposeProjects(google.protobuf.Empty) returns (ResourceCollectionResponse);
  rpc RunComposeAction(RegisteredActionRequest) returns (OperationHandle);
  rpc GetConfigRepositoryStatus(RegisteredResourceRequest) returns (ResourceSnapshot);
  rpc GetDockerSettings(google.protobuf.Empty) returns (DockerSettingsResponse);
  rpc RunConfigRepositoryAction(RegisteredActionRequest) returns (OperationHandle);
  rpc RunPlatformMaintenance(RegisteredActionRequest) returns (OperationHandle);
  rpc DownloadDiagnosticBundle(DiagnosticBundleRequest) returns (stream DiagnosticBundleChunk);
}

// Private bytes are transient UDS input only, never a durable OperationHandle.
message NotificationConfigurationRequest {
  string channel_id = 1;
  string operation_id = 2;
  string expected_revision = 3;
  string action = 4;
  bytes private_json = 5;
  RequestContext context = 6;
}

message NotificationConfigurationLookup { string channel_id = 1; string operation_id = 2; }
message NotificationConfigurationMetadata {
  string revision = 1;
  string destination_reference = 2;
  string credential_reference = 3;
  bool has_target = 4;
  bool has_credential = 5;
  bool applied = 6;
  bool replayed = 7;
  string operation_id = 8;
  bool binding_current = 9;
}

service NotificationConfigurationService {
  rpc Inspect(NotificationConfigurationLookup) returns (NotificationConfigurationMetadata);
  rpc Apply(NotificationConfigurationRequest) returns (NotificationConfigurationMetadata);
}

// Host PTY only. Not an arbitrary executable/UID/path RPC. The first frame
// opens one root-recorded UUID; subsequent frames carry input, resize or close.
message HostTerminalFrame {
  string session_id = 1;
  RequestContext context = 2;
  string kind = 3;
  bytes data = 4;
  uint32 columns = 5;
  uint32 rows = 6;
}
message HostTerminalEvent {
  string kind = 1;
  bytes data = 2;
  string code = 3;
  int32 exit_code = 4;
}
service HostTerminalService {
  rpc Connect(stream HostTerminalFrame) returns (stream HostTerminalEvent);
}

// Container Exec has a dedicated method capability. Only the first frame may
// bind a full immutable container ID, startup instance and fixed shell choice.
message ContainerTerminalFrame {
  HostTerminalFrame payload = 1;
  string container_id = 2;
  string instance_id = 3;
  string shell = 4;
}
message ContainerTerminalTarget {
  string container_id = 1;
  string name = 2;
  string instance_id = 3;
  string image_id = 4;
  string configured_user = 5;
}
service ContainerTerminalService {
  rpc Inspect(ResourceReference) returns (ContainerTerminalTarget);
  rpc Connect(stream ContainerTerminalFrame) returns (stream HostTerminalEvent);
}

// Registered host roots only; paths are relative and never host executables.
message FileLocation { string root_id = 1; string path = 2; }
message FileRoot { string id = 1; string name = 2; repeated string actions = 3; }
message FileRoots { repeated FileRoot roots = 1; }
message FileEntry {
  string name = 1; string kind = 2; int64 size_bytes = 3;
  int64 modified_at_unix_ms = 4; string version = 5; string mode = 6; bool is_protected = 7;
}
message FileListRequest { FileLocation location = 1; string after = 2; uint32 take = 3; }
message FileListResponse { repeated FileEntry entries = 1; string next_cursor = 2; string version = 3; }
message FileSearchRequest {
  FileLocation location = 1; string query = 2; string kind = 3;
  bool match_case = 4; string cursor = 5; uint32 take = 6;
}
message FileSearchHit { string path = 1; FileEntry entry = 2; }
message FileSearchResponse {
  repeated FileSearchHit entries = 1; string next_cursor = 2; uint32 scanned_entries = 3;
  uint32 excluded_entries = 4; bool complete = 5; string stop_reason = 6; bool depth_limited = 7;
}
message FileContentSearchRequest {
  FileLocation location = 1; string query = 2; bool match_case = 3;
  string cursor = 4; uint32 take = 5; uint32 max_file_bytes = 6;
}
message FileContentSearchHit {
  string path = 1; FileEntry entry = 2; uint32 line_number = 3;
  string excerpt = 4; bool excerpt_truncated = 5;
}
message FileContentSearchResponse {
  repeated FileContentSearchHit entries = 1; string next_cursor = 2; uint32 scanned_entries = 3;
  uint32 excluded_entries = 4; bool complete = 5; string stop_reason = 6; bool depth_limited = 7;
  uint32 scanned_files = 8; int64 read_bytes = 9; uint32 skipped_non_text_files = 10; uint32 skipped_oversized_files = 11;
}
message FileDownloadRequest { FileLocation location = 1; string expected_version = 2; }
message FileDownloadFrame { string kind = 1; FileEntry metadata = 2; bytes data = 3; int64 offset = 4; string sha256 = 5; string version = 6; int64 size_bytes = 7; }
message FileUploadHeader {
  FileLocation location = 1; string operation_id = 2; string owner = 3;
  int64 size_bytes = 4; string sha256 = 5; string expected_version = 6; RequestContext context = 7;
}
message FileUploadFrame { FileUploadHeader header = 1; bytes data = 2; int64 offset = 3; bool commit = 4; }
message FileUploadLookup { string operation_id = 1; string owner = 2; }
message FileUploadReceipt {
  string operation_id = 1; string state = 2; int64 size_bytes = 3; string sha256 = 4;
  string version = 5; bool previous_retained = 6; bool replayed = 7; bool binding_current = 8; bool is_in_progress = 9;
  FileHddBackupProof hdd_backup = 10;
  string result_code = 11;
}
message FileHddBackupProof {
  string operation_id = 1; string storage_id = 2; string source_version = 3;
  int64 size_bytes = 4; string sha256 = 5; int64 created_at_unix_ms = 6; bool different_source_device = 7;
}
service FileTransferService {
  rpc ListRoots(google.protobuf.Empty) returns (FileRoots);
  rpc List(FileListRequest) returns (FileListResponse);
  rpc Directories(FileListRequest) returns (FileListResponse);
  rpc Search(FileSearchRequest) returns (FileSearchResponse);
  rpc SearchContent(FileContentSearchRequest) returns (FileContentSearchResponse);
  rpc Inspect(FileLocation) returns (FileEntry);
  rpc Download(FileDownloadRequest) returns (stream FileDownloadFrame);
  rpc Upload(stream FileUploadFrame) returns (FileUploadReceipt);
  // Separate method capabilities: API may stage bytes, Worker may publish or discard.
  rpc StageUpload(stream FileUploadFrame) returns (FileUploadReceipt);
  rpc PublishUpload(FileUploadLookup) returns (FileUploadReceipt);
  rpc DiscardUpload(FileUploadLookup) returns (FileUploadReceipt);
  rpc GetUploadStatus(FileUploadLookup) returns (FileUploadReceipt);
}

// File mutations are separate method capabilities, not arbitrary commands.
enum FileOperationKind {
  FILE_OPERATION_KIND_UNSPECIFIED = 0;
  FILE_OPERATION_KIND_CREATE_DIRECTORY = 1;
  FILE_OPERATION_KIND_COPY_FILE = 2;
  FILE_OPERATION_KIND_MOVE_FILE = 3;
  FILE_OPERATION_KIND_SET_PERMISSIONS = 4;
}
message FileOperationCommand {
  FileOperationKind kind = 1;
  FileLocation source = 2;
  FileLocation target = 3;
  string expected_version = 4;
  string mode = 5;
}
message FileDirectoryIdentity { uint64 device = 1; uint64 inode = 2; }
message FileObjectIdentity {
  uint64 device = 1; uint64 inode = 2; uint32 mode = 3;
  uint32 owner_uid = 4; uint32 owner_gid = 5; uint64 link_count = 6;
  int64 size_bytes = 7; int64 modified_at_unix_ns = 8;
}
message FileOperationPlan {
  FileOperationCommand command = 1;
  FileObjectIdentity source_identity = 2;
  FileDirectoryIdentity source_parent = 3;
  FileDirectoryIdentity target_parent = 4;
  int64 size_bytes = 5;
  string sha256 = 6;
  string fingerprint = 7;
}
message FileOperationPlanRequest { FileOperationCommand command = 1; RequestContext context = 2; }
message FileOperationApplyRequest {
  string operation_id = 1; string owner = 2;
  FileOperationPlan plan = 3; RequestContext context = 4;
}
message FileOperationLookup { string operation_id = 1; string owner = 2; }
message FileOperationReceipt {
  string operation_id = 1; FileOperationKind kind = 2; string state = 3;
  string fingerprint = 4; string version = 5; int64 size_bytes = 6;
  string sha256 = 7; bool source_retained = 8; bool binding_current = 9;
}
service FileOperationService {
  rpc Plan(FileOperationPlanRequest) returns (FileOperationPlan);
  rpc Apply(FileOperationApplyRequest) returns (FileOperationReceipt);
  rpc Inspect(FileOperationLookup) returns (FileOperationReceipt);
  // Durable cancellation tombstone, including before a delayed Apply arrives.
  rpc Discard(FileOperationApplyRequest) returns (FileOperationReceipt);
}

// Dedicated history/trash capability; never changes old signed mutation plans.
enum FileArchiveKind {
  FILE_ARCHIVE_KIND_UNSPECIFIED = 0;
  FILE_ARCHIVE_KIND_TRASH = 1;
  FILE_ARCHIVE_KIND_RESTORE = 2;
  FILE_ARCHIVE_KIND_PURGE = 3;
}
message FileHistoryRequest {
  FileLocation location = 1; string after = 2; uint32 take = 3;
  string expected_version = 4;
}
message FileVersionRecord {
  string version_id = 1; FileLocation location = 2; string source_version = 3;
  int64 size_bytes = 4; string sha256 = 5; int64 created_at_unix_ms = 6;
  string capture_kind = 7; string capture_state = 8; string availability = 9;
  bool different_source_device = 10;
}
message FileHistoryPage {
  repeated FileVersionRecord entries = 1; string next_cursor = 2;
  string version = 3; uint32 scanned = 4; uint32 invalid_records = 5;
  bool complete = 6;
}
message FileArchiveCommand {
  FileArchiveKind kind = 1; FileLocation location = 2;
  string version_id = 3; string expected_version = 4;
}
message FileArchiveIdentity {
  string metadata_hash = 1; FileObjectIdentity data_identity = 2;
}
message FileArchivePlan {
  FileArchiveCommand command = 1; FileDirectoryIdentity parent_identity = 2;
  FileObjectIdentity source_identity = 3; string source_sha256 = 4;
  FileArchiveIdentity archive_identity = 5; FileObjectIdentity restore_metadata = 6;
  int64 size_bytes = 7; string sha256 = 8; string fingerprint = 9;
}
message FileArchivePlanRequest { FileArchiveCommand command = 1; RequestContext context = 2; }
message FileArchiveApplyRequest {
  string operation_id = 1; string owner = 2; FileArchivePlan plan = 3;
  RequestContext context = 4;
}
message FileArchiveLookup { string operation_id = 1; string owner = 2; }
message FileArchiveReceipt {
  string operation_id = 1; FileArchiveKind kind = 2; string state = 3;
  string fingerprint = 4; string version = 5; int64 size_bytes = 6;
  string sha256 = 7; bool source_retained = 8; bool binding_current = 9;
  string version_id = 10; FileHddBackupProof hdd_backup = 11;
}
service FileArchiveService {
  rpc List(FileHistoryRequest) returns (FileHistoryPage);
  rpc Plan(FileArchivePlanRequest) returns (FileArchivePlan);
  rpc Apply(FileArchiveApplyRequest) returns (FileArchiveReceipt);
  rpc Inspect(FileArchiveLookup) returns (FileArchiveReceipt);
  rpc Discard(FileArchiveApplyRequest) returns (FileArchiveReceipt);
}

// Dedicated directory protocol; never changes old signed regular-file plans.
// The complete bounded manifest stays at the Agent. No large JSON frame or
// arbitrary host path, UID, executable or archive command crosses this RPC.
message FileTreeCopyCommand {
  FileLocation source = 1; string expected_version = 2; FileLocation target = 3;
}
message FileTreeCopyPlan {
  FileTreeCopyCommand command = 1; string manifest_sha256 = 2;
  uint32 entry_count = 3; int64 total_bytes = 4;
  FileDirectoryIdentity target_parent = 5;
  string source_policy_hash = 6; string target_policy_hash = 7;
  string fingerprint = 8;
}
message FileTreeCopyPlanRequest { FileTreeCopyCommand command = 1; RequestContext context = 2; }
message FileTreeCopyApplyRequest {
  string operation_id = 1; string owner = 2;
  FileTreeCopyPlan plan = 3; RequestContext context = 4;
}
message FileTreeCopyLookup { string operation_id = 1; string owner = 2; }
message FileTreeCopyReceipt {
  string operation_id = 1; string state = 2; string fingerprint = 3;
  uint32 entry_count = 4; int64 total_bytes = 5;
  string version = 6; bool partial_retained = 7;
}
service FileTreeCopyService {
  rpc Plan(FileTreeCopyPlanRequest) returns (FileTreeCopyPlan);
  rpc Apply(FileTreeCopyApplyRequest) returns (FileTreeCopyReceipt);
  rpc Inspect(FileTreeCopyLookup) returns (FileTreeCopyReceipt);
  rpc Discard(FileTreeCopyApplyRequest) returns (FileTreeCopyReceipt);
}

// Independent move intent: copy to a new target, retain original source leaves,
// remove only empty source directories. Never reinterpret old copy plans.
message FileTreeMovePlan {
  FileTreeCopyPlan copy_plan = 1; FileDirectoryIdentity source_parent = 2;
  string fingerprint = 3;
}
message FileTreeMovePlanRequest { FileTreeCopyCommand command = 1; RequestContext context = 2; }
message FileTreeMoveApplyRequest {
  string operation_id = 1; string owner = 2; FileTreeMovePlan plan = 3;
  RequestContext context = 4;
}
message FileTreeMoveLookup { string operation_id = 1; string owner = 2; }
message FileTreeMoveReceipt {
  string operation_id = 1; string state = 2; string fingerprint = 3;
  uint32 entry_count = 4; int64 total_bytes = 5; string version = 6;
  bool destination_published = 7; bool source_removed = 8;
  // Original file leaves are retained privately; empty directory metadata is
  // represented by the verified manifest. This is not an HDD backup proof.
  bool source_retained = 9; bool partial_retained = 10;
}
service FileTreeMoveService {
  rpc Plan(FileTreeMovePlanRequest) returns (FileTreeMovePlan);
  rpc Apply(FileTreeMoveApplyRequest) returns (FileTreeMoveReceipt);
  rpc Inspect(FileTreeMoveLookup) returns (FileTreeMoveReceipt);
  rpc Discard(FileTreeMoveApplyRequest) returns (FileTreeMoveReceipt);
}

// Independent compression intent. Only registered source/target locations;
// manifests stay at the Agent. Old file/copy/move contracts are unchanged.
message FileTreePackingCommand { FileTreeCopyCommand tree = 1; string format = 2; }
message FileTreePackingPlan {
  FileTreePackingCommand command = 1; string manifest_sha256 = 2;
  uint32 entry_count = 3; int64 total_bytes = 4;
  FileDirectoryIdentity target_parent = 5;
  string source_policy_hash = 6; string target_policy_hash = 7;
  string fingerprint = 8;
}
message FileTreePackingPlanRequest { FileTreePackingCommand command = 1; RequestContext context = 2; }
message FileTreePackingApplyRequest {
  string operation_id = 1; string owner = 2;
  FileTreePackingPlan plan = 3; RequestContext context = 4;
}
message FileTreePackingLookup { string operation_id = 1; string owner = 2; }
message FileTreePackingDownloadRequest {
  string operation_id = 1; string owner = 2; RequestContext context = 3;
}
message FileTreePackingReceipt {
  string operation_id = 1; string state = 2; string fingerprint = 3;
  string format = 4; uint32 entry_count = 5; int64 total_bytes = 6;
  int64 archive_bytes = 7; string archive_sha256 = 8;
  string version = 9; bool partial_retained = 10;
}
service FileTreePackingService {
  rpc Plan(FileTreePackingPlanRequest) returns (FileTreePackingPlan);
  rpc Apply(FileTreePackingApplyRequest) returns (FileTreePackingReceipt);
  rpc Inspect(FileTreePackingLookup) returns (FileTreePackingReceipt);
  rpc Discard(FileTreePackingApplyRequest) returns (FileTreePackingReceipt);
  // At most 17 GiB and 32 KiB/chunk, bound to a completed exact receipt.
  // Does not enlarge the old general-file 1 GiB download capability.
  rpc Download(FileTreePackingDownloadRequest) returns (stream FileDownloadFrame);
}
