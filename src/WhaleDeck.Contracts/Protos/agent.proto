  FileDirectoryIdentity parent_identity = 4; string parent_version = 5; uint32 owner_uid = 6; uint32 owner_gid = 7;
  FileDirectoryIdentity private_identity = 8; FileObjectIdentity deleted_identity = 9; int64 deleted_changed_at_unix_ns = 10;
  string source_record_digest = 11; string purge_record_digest = 12; string purge_marker_digest = 13;
  string history_metadata_digest = 14; string storage_hash = 15; FileDirectoryIdentity store_identity = 16;
