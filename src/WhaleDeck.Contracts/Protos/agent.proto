  string operation_id = 1; string source_operation_id = 2; string archive_operation_id = 3;
  string fingerprint = 4; string state = 5; bool source_fenced = 6; bool owned_fence = 7;
  optional bool retirement_applied = 8; int64 not_before_unix_ms = 9;
