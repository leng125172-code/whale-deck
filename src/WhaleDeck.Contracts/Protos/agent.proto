// Bounded recursive ordinary modes. Manifest stays root-private on attested HDD.
// No caller paths to host storage, selected owner, ACL or automatic continuation.
message ContainerRecursivePermissionCommand {
  ContainerFileLocation location = 1; string file_mode = 2; string directory_mode = 3; string expected_version = 4;
}
message ContainerRecursivePermissionPlan {
  uint32 schema_version = 1; ContainerRecursivePermissionCommand command = 2; string target_proof = 3;
  FileDirectoryIdentity parent_identity = 4; string parent_version = 5;
  uint32 owner_uid = 6; uint32 owner_gid = 7; string fingerprint = 8;
  FileObjectIdentity root_identity = 9; int64 root_changed_at_unix_ns = 10;
  string manifest_digest = 11; uint32 entry_count = 12; uint32 file_count = 13;
  uint32 directory_count = 14; uint32 change_count = 15;
}
message ContainerRecursivePermissionPlanRequest { ContainerRecursivePermissionCommand command = 1; RequestContext context = 2; }
message ContainerRecursivePermissionRequest {
  string operation_id = 1; string owner = 2; ContainerRecursivePermissionPlan plan = 3; RequestContext context = 4;
}
message ContainerRecursivePermissionReceipt {
  string operation_id = 1; string container_id = 2; string instance_id = 3; string fingerprint = 4;
  string target_proof = 5; string state = 6; bool binding_current = 7; bool replayed = 8;
  uint32 completed_count = 9; uint32 changed_count = 10; uint32 aborted_count = 11;
  uint32 not_started_count = 12; uint32 unknown_count = 13;
  bool history_may_exist = 14; bool history_verified = 15; string history_digest = 16;
  bool history_available = 17; string outcome_digest = 18;
}
service ContainerRecursivePermissionService {
  rpc Plan(ContainerRecursivePermissionPlanRequest) returns (ContainerRecursivePermissionPlan);
  rpc Apply(ContainerRecursivePermissionRequest) returns (ContainerRecursivePermissionReceipt);
  rpc Inspect(ContainerRecursivePermissionRequest) returns (ContainerRecursivePermissionReceipt);
  rpc Discard(ContainerRecursivePermissionRequest) returns (ContainerRecursivePermissionReceipt);
}

// Independent recursive ownership authority. UID/GID presence is required; explicit zero means root.
// Manifests and old metadata stay root-private; recovery never resumes fchown.
message ContainerRecursiveOwnershipCommand {
  ContainerFileLocation location = 1; optional uint32 uid = 2; optional uint32 gid = 3; string expected_version = 4;
}
message ContainerRecursiveOwnershipPlan {
  uint32 schema_version = 1; ContainerRecursiveOwnershipCommand command = 2; string target_proof = 3;
  FileDirectoryIdentity parent_identity = 4; string parent_version = 5;
  uint32 owner_uid = 6; uint32 owner_gid = 7; string fingerprint = 8;
  FileObjectIdentity root_identity = 9; int64 root_changed_at_unix_ns = 10;
  string manifest_digest = 11; uint32 entry_count = 12; uint32 file_count = 13;
  uint32 directory_count = 14; uint32 change_count = 15;
}
message ContainerRecursiveOwnershipPlanRequest { ContainerRecursiveOwnershipCommand command = 1; RequestContext context = 2; }
message ContainerRecursiveOwnershipRequest {
  string operation_id = 1; string owner = 2; ContainerRecursiveOwnershipPlan plan = 3; RequestContext context = 4;
}
message ContainerRecursiveOwnershipReceipt {
  string operation_id = 1; string container_id = 2; string instance_id = 3; string fingerprint = 4;
  string target_proof = 5; string state = 6; bool binding_current = 7; bool replayed = 8;
  uint32 completed_count = 9; uint32 changed_count = 10; uint32 aborted_count = 11;
  uint32 not_started_count = 12; uint32 unknown_count = 13;
  bool history_may_exist = 14; bool history_verified = 15; string history_digest = 16;
  bool history_available = 17; string outcome_digest = 18;
}
service ContainerRecursiveOwnershipService {
  rpc Plan(ContainerRecursiveOwnershipPlanRequest) returns (ContainerRecursiveOwnershipPlan);
  rpc Apply(ContainerRecursiveOwnershipRequest) returns (ContainerRecursiveOwnershipReceipt);
  rpc Inspect(ContainerRecursiveOwnershipRequest) returns (ContainerRecursiveOwnershipReceipt);
  rpc Discard(ContainerRecursiveOwnershipRequest) returns (ContainerRecursiveOwnershipReceipt);
}

// Independent POSIX ACL authority, protocol 1.51. No mode/owner/recursive action.
// Named IDs and permissions have explicit presence; ID zero is a real qualifier.
message ContainerAclEntry { string tag = 1; optional uint32 id = 2; optional uint32 permissions = 3; }
message ContainerAclCommand {
  ContainerFileLocation location = 1; string acl_type = 2; repeated ContainerAclEntry entries = 3; string expected_version = 4;
}
message ContainerAclPlan {
  uint32 schema_version = 1; ContainerAclCommand command = 2; string target_proof = 3;
  FileDirectoryIdentity parent_identity = 4; string parent_version = 5;
  uint32 owner_uid = 6; uint32 owner_gid = 7; string fingerprint = 8;
  string kind = 9; FileObjectIdentity source_identity = 10; int64 source_changed_at_unix_ns = 11;
  string attributes_digest = 12; bool no_change = 13;
  repeated ContainerAclEntry access_acl = 14; repeated ContainerAclEntry default_acl = 15; uint32 target_mode = 16;
}
message ContainerAclPlanRequest { ContainerAclCommand command = 1; RequestContext context = 2; }
message ContainerAclRequest { string operation_id = 1; string owner = 2; ContainerAclPlan plan = 3; RequestContext context = 4; }
message ContainerAclReceipt {
  string operation_id = 1; string container_id = 2; string instance_id = 3; string fingerprint = 4;
  string target_proof = 5; string state = 6; string version = 7; bool binding_current = 8; bool replayed = 9;
  string kind = 10; optional bool acl_confirmed = 11; bool no_change = 12;
  bool history_may_exist = 13; bool history_verified = 14; string history_digest = 15;
  string acl_type = 16; uint32 target_mode = 17;
}
service ContainerAclService {
  rpc Plan(ContainerAclPlanRequest) returns (ContainerAclPlan);
  rpc Apply(ContainerAclRequest) returns (ContainerAclReceipt);
  rpc Inspect(ContainerAclRequest) returns (ContainerAclReceipt);
  rpc Discard(ContainerAclRequest) returns (ContainerAclReceipt);
}

// Independent read-only ACL preimage authority, protocol 1.52.
message ContainerAclHistoryListRequest {
  ContainerFileLocation location = 1; string after = 2; uint32 take = 3; string expected_version = 4; RequestContext context = 5;
}
message ContainerAclHistoryReadRequest {
  ContainerFileLocation location = 1; string capture_id = 2; string expected_history_digest = 3; RequestContext context = 4;
}
message ContainerAclHistoryEntry {
  string capture_id = 1; string history_digest = 2; optional int64 created_at_unix_ms = 3; string source_instance_id = 4;
  string changed_acl_type = 5; string kind = 6; optional uint32 original_mode = 7; optional uint32 access_entry_count = 8; optional uint32 default_entry_count = 9;
}
message ContainerAclHistoryPage {
  ContainerFileLocation location = 1; string version = 2; repeated ContainerAclHistoryEntry entries = 3;
  string next_after = 4; optional uint32 scanned_count = 5; optional uint32 invalid_count = 6; optional bool complete = 7;
}
message ContainerAclHistorySnapshot {
  ContainerFileLocation location = 1; ContainerAclHistoryEntry entry = 2;
  repeated ContainerAclEntry access_acl = 3; repeated ContainerAclEntry default_acl = 4;
}
service ContainerAclHistoryService {
  rpc List(ContainerAclHistoryListRequest) returns (ContainerAclHistoryPage);
  rpc Read(ContainerAclHistoryReadRequest) returns (ContainerAclHistorySnapshot);
}

// Independent recursive ACL authority, protocol 1.53. Wrapper presence is significant:
// default requires absent file_entries and present directory_entries (empty explicitly clears).
message ContainerRecursiveAclEntries { repeated ContainerAclEntry entries = 1; }
message ContainerRecursiveAclCommand {
  ContainerFileLocation location = 1; string acl_type = 2;
  ContainerRecursiveAclEntries file_entries = 3; ContainerRecursiveAclEntries directory_entries = 4;
  string expected_version = 5;
}
message ContainerRecursiveAclPlan {
  uint32 schema_version = 1; ContainerRecursiveAclCommand command = 2; string target_proof = 3;
  FileDirectoryIdentity parent_identity = 4; string parent_version = 5;
  uint32 owner_uid = 6; uint32 owner_gid = 7; string fingerprint = 8;
  FileObjectIdentity root_identity = 9; int64 root_changed_at_unix_ns = 10;
  string manifest_digest = 11; uint32 entry_count = 12; uint32 file_count = 13;
  uint32 directory_count = 14; uint32 change_count = 15;
}
message ContainerRecursiveAclPlanRequest { ContainerRecursiveAclCommand command = 1; RequestContext context = 2; }
message ContainerRecursiveAclRequest {
  string operation_id = 1; string owner = 2; ContainerRecursiveAclPlan plan = 3; RequestContext context = 4;
}
message ContainerRecursiveAclReceipt {
  string operation_id = 1; string container_id = 2; string instance_id = 3; string fingerprint = 4;
  string target_proof = 5; string state = 6; bool binding_current = 7; bool replayed = 8;
  uint32 completed_count = 9; uint32 changed_count = 10; uint32 aborted_count = 11;
  uint32 not_started_count = 12; uint32 unknown_count = 13;
  bool history_may_exist = 14; bool history_verified = 15; string history_digest = 16;
  bool history_available = 17; string outcome_digest = 18; string acl_type = 19;
}
service ContainerRecursiveAclService {
  rpc Plan(ContainerRecursiveAclPlanRequest) returns (ContainerRecursiveAclPlan);
  rpc Apply(ContainerRecursiveAclRequest) returns (ContainerRecursiveAclReceipt);
  rpc Inspect(ContainerRecursiveAclRequest) returns (ContainerRecursiveAclReceipt);
  rpc Discard(ContainerRecursiveAclRequest) returns (ContainerRecursiveAclReceipt);
}

// Independent bounded recursive ACL history reads, protocol 1.54. No write/restore method.
message ContainerRecursiveAclHistoryListRequest {
  ContainerFileLocation location = 1; string after = 2; uint32 take = 3; string expected_version = 4; RequestContext context = 5;
}
message ContainerRecursiveAclHistoryReadRequest {
  ContainerFileLocation location = 1; string capture_id = 2; string expected_history_digest = 3;
  optional uint32 offset = 4; uint32 take = 5; RequestContext context = 6;
}
// Counts describe the complete captured plan, never the outcome of its execution.
message ContainerRecursiveAclHistorySummary {
  string capture_id = 1; string history_digest = 2; optional int64 created_at_unix_ms = 3;
  string source_instance_id = 4; string changed_acl_type = 5; string manifest_digest = 6;
  optional uint32 entry_count = 7; optional uint32 file_count = 8;
  optional uint32 directory_count = 9; optional uint32 change_count = 10;
}
message ContainerRecursiveAclHistoryPage {
  ContainerFileLocation location = 1; string version = 2; repeated ContainerRecursiveAclHistorySummary entries = 3;
  string next_after = 4; optional uint32 scanned_count = 5; optional uint32 invalid_count = 6; optional bool complete = 7;
}
message ContainerRecursiveAclHistoryEntry {
  string relative_path = 1; string kind = 2; optional uint32 original_mode = 3;
  repeated ContainerAclEntry access_acl = 4; repeated ContainerAclEntry default_acl = 5;
}
message ContainerRecursiveAclHistorySnapshot {
  ContainerFileLocation location = 1; ContainerRecursiveAclHistorySummary summary = 2;
  optional uint32 offset = 3; repeated ContainerRecursiveAclHistoryEntry entries = 4;
  optional bool complete = 5; optional uint32 next_offset = 6;
}
service ContainerRecursiveAclHistoryService {
  rpc List(ContainerRecursiveAclHistoryListRequest) returns (ContainerRecursiveAclHistoryPage);
  rpc Read(ContainerRecursiveAclHistoryReadRequest) returns (ContainerRecursiveAclHistorySnapshot);
}

// Independent heterogeneous history restore authority, protocol 1.55.
// Only a source reference crosses RPC; per-inode ACLs stay in verified HDD metadata.
message ContainerRecursiveAclRestoreCommand {
  ContainerFileLocation location = 1; string capture_id = 2;
  string expected_history_digest = 3; string expected_version = 4;
}
message ContainerRecursiveAclRestoreFrame {
  optional uint64 device = 1; optional uint64 inode = 2; optional uint32 mode = 3;
  optional uint32 owner_uid = 4; optional uint32 owner_gid = 5; optional uint64 link_count = 6;
  optional int64 size_bytes = 7; optional int64 modified_at_unix_ns = 8; optional int64 changed_at_unix_ns = 9;
}
message ContainerRecursiveAclRestorePlan {
  uint32 schema_version = 1; ContainerRecursiveAclRestoreCommand command = 2; string target_proof = 3;
  FileDirectoryIdentity parent_identity = 4; string parent_version = 5;
  uint32 owner_uid = 6; uint32 owner_gid = 7; string fingerprint = 8;
  FileObjectIdentity root_identity = 9; int64 root_changed_at_unix_ns = 10;
  string manifest_digest = 11; uint32 entry_count = 12; uint32 file_count = 13;
  uint32 directory_count = 14; uint32 change_count = 15;
  ContainerRecursiveAclHistorySummary restore_source = 16;
  ContainerRecursiveAclRestoreFrame restore_source_frame = 17; string restore_targets_digest = 18;
}
message ContainerRecursiveAclRestorePlanRequest { ContainerRecursiveAclRestoreCommand command = 1; RequestContext context = 2; }
message ContainerRecursiveAclRestoreRequest {
  string operation_id = 1; string owner = 2; ContainerRecursiveAclRestorePlan plan = 3; RequestContext context = 4;
}
message ContainerRecursiveAclRestoreReceipt {
  string operation_id = 1; string container_id = 2; string instance_id = 3; string fingerprint = 4;
  string target_proof = 5; string state = 6; bool binding_current = 7; bool replayed = 8;
  uint32 completed_count = 9; uint32 changed_count = 10; uint32 aborted_count = 11;
  uint32 not_started_count = 12; uint32 unknown_count = 13;
  bool history_may_exist = 14; bool history_verified = 15; string history_digest = 16;
  bool history_available = 17; string outcome_digest = 18; string acl_type = 19;
}
service ContainerRecursiveAclRestoreService {
  rpc Plan(ContainerRecursiveAclRestorePlanRequest) returns (ContainerRecursiveAclRestorePlan);
  rpc Apply(ContainerRecursiveAclRestoreRequest) returns (ContainerRecursiveAclRestoreReceipt);
  rpc Inspect(ContainerRecursiveAclRestoreRequest) returns (ContainerRecursiveAclRestoreReceipt);
  rpc Discard(ContainerRecursiveAclRestoreRequest) returns (ContainerRecursiveAclRestoreReceipt);
}

// Explicit new-inode restoration from a confirmed purged archive; never old inode restore.
message ContainerRecycleArchiveSource { string operation_id = 1; string owner = 2; ContainerRecyclePurgePlan plan = 3; }
message ContainerRecycleArchiveCommand { ContainerRecycleArchiveSource purge = 1; string history_digest = 2; string mode = 3; }
