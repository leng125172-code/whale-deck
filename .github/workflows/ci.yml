name: ci

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check shell syntax and side-effect-free preview
        run: |
          bash -n install.sh
          bash -n deploy/host/publish-and-install.sh
          bash -n deploy/host/install.sh
          bash tests/installer-cli.sh
          python3 -m unittest discover -s tests -p test_host_runtime.py
          bash -n deploy/build-images.sh
          python3 -m unittest discover -s tests -p 'test_build_*.py'
          bash -n deploy/ci/install-frontend-dependencies.sh
          python3 -m unittest discover -s tests -p test_ci_frontend_install.py
          bash -n deploy/host/whaledeck-privileged
          python3 -m unittest discover -s deploy/validation -p test_container_terminal.py
          sudo python3 -W error::ResourceWarning -m unittest discover -s deploy/validation -p 'test_container_file*.py'
          python3 -m py_compile deploy/validation/validate_container_file_reads.py
          python3 -m py_compile deploy/host/whaledeck-container-upload.py deploy/validation/validate_container_file_staging.py
          python3 -m py_compile deploy/host/whaledeck-container-backups.py deploy/validation/validate_container_file_backups.py
          python3 -m py_compile deploy/host/whaledeck-container-publish.py deploy/validation/validate_container_file_publishing.py
          python3 -m py_compile deploy/host/whaledeck-container-file-write.py deploy/validation/validate_container_file_write_profile.py deploy/validation/validate_container_file_write_agent.py
          python3 -m py_compile deploy/validation/validate_bff_session_valkey.py
          python3 -m py_compile deploy/validation/validate_container_file_bff_extended.py
          python3 -m unittest discover -s deploy/validation -p test_metric_continuity.py
          python3 -m unittest discover -s deploy/validation -p test_scope_baseline.py
          python3 -W error::ResourceWarning -m unittest discover -s deploy/validation -p test_authentik_branding.py
          python3 -m unittest discover -s deploy/validation -p test_tree_rpc_diagnostics.py
          python3 -m unittest discover -s deploy/validation -p test_unpacking_probe_scope.py
          python3 -m unittest discover -s deploy/validation -p test_restoring_probe_scope.py
          sudo python3 -m unittest discover -s deploy/validation -p test_overwrite_probe_scope.py
          sudo python3 -W error::ResourceWarning -m unittest discover -s deploy/validation -p test_purging_probe_scope.py
          python3 -m py_compile deploy/validation/validate_tree_purging_agent.py
          sudo python3 -W error::ResourceWarning -m unittest discover -s deploy/validation -p test_overwrite_bff_contract.py
          python3 -m py_compile deploy/validation/validate_tree_overwrite_restoring_agent.py
          python3 -m py_compile deploy/validation/validate_file_tree_overwrite_restoring_bff.py
          python3 -m py_compile deploy/validation/validate_file_tree_unpacking_bff.py
          python3 -m py_compile deploy/validation/validate_file_tree_restoring_bff.py
          sudo python3 -m unittest discover -s deploy/validation -p test_unpacking_browser_fixture.py
          sudo python3 -W error::ResourceWarning -m unittest discover -s deploy/validation -p test_restoring_browser_fixture.py
          sudo python3 -W error::ResourceWarning -m unittest discover -s deploy/validation -p test_overwriting_browser_fixture.py
          sudo python3 -W error::ResourceWarning -m unittest discover -s deploy/validation -p test_purging_browser_fixture.py
          sudo python3 -m unittest discover -s deploy/validation -p test_file_transport.py
          sudo python3 -m unittest discover -s deploy/validation -p test_file_operations.py
          sudo python3 -m unittest discover -s deploy/validation -p test_file_roots_upgrade.py
          sudo python3 -m unittest discover -s deploy/validation -p test_file_browser.py
          sudo python3 -m unittest discover -s deploy/validation -p test_file_content_search.py
          sudo python3 -m unittest discover -s deploy/validation -p test_file_backups.py
          sudo python3 -m unittest discover -s deploy/validation -p test_file_archives.py
          sudo python3 -m unittest discover -s deploy/validation -p test_file_tree_manifest.py
          sudo python3 -m unittest discover -s deploy/validation -p test_tree_archive_codec.py
          sudo python3 -m unittest discover -s deploy/validation -p test_tree_backups.py
          sudo python3 -m unittest discover -s deploy/validation -p test_tree_packing.py
          sudo python3 -m unittest discover -s deploy/validation -p test_tree_unpacking.py
          sudo python3 -W error::ResourceWarning -m unittest discover -s deploy/validation -p test_tree_restoring.py
            sudo python3 -W error::ResourceWarning -m unittest discover -s deploy/validation -p test_tree_overwrite_restoring.py
          sudo python3 -W error::ResourceWarning -m unittest discover -s deploy/validation -p test_tree_recycling.py
          sudo python3 -W error::ResourceWarning -m unittest discover -s deploy/validation -p 'test_tree_purg*.py'
          sudo python3 -m unittest discover -s deploy/validation -p test_tree_copies.py
          sudo python3 -m unittest discover -s deploy/validation -p test_tree_moves.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - name: Compile native Agent validation clients
        run: dotnet build deploy/validation/TerminalProbe/TerminalProbe.csproj --configuration Release
      - run: dotnet test --configuration Release --no-build --logger trx
      - run: dotnet list package --vulnerable --include-transitive
      - name: Inspect actual application binaries without dependency configuration
        run: |
          for component in Api Worker Agent MaintenanceHost Migrator; do
            dotnet "src/WhaleDeck.$component/bin/Release/net10.0/WhaleDeck.$component.dll" --build-info > "/tmp/wd-build-$component.json"
          done
          python3 - <<'PY'
          import json, os
          for component in ['Api', 'Worker', 'Agent', 'MaintenanceHost', 'Migrator']:
              with open('/tmp/wd-build-' + component + '.json') as file:
                  value = json.load(file)
              assert value == {'component': 'WhaleDeck.' + component, 'version': '0.1.0', 'sourceRevision': os.environ['GITHUB_SHA']}, value
          PY

  native-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          # Isolated disposable CI service, loopback only; no production secret.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Create isolated application-owned native database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
          CREATE ROLE whaledeck LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
          CREATE DATABASE wdv_dispatch_0000000000000001 OWNER whaledeck;
          SQL
      - name: Run actual migrations, SQL lifecycle and transactional audit
        env:
          WHALEDECK_NATIVE_TEST_CONNECTION: Host=127.0.0.1;Port=15432;Database=wdv_dispatch_0000000000000001;Username=whaledeck
        run: >-
          dotnet test tests/WhaleDeck.IntegrationTests/WhaleDeck.IntegrationTests.csproj
          --configuration Release --logger "trx;LogFileName=native-ci.trx"
          --filter FullyQualifiedName~NativeNotificationDispatchTests.RealPostgresLateCommitFanoutLeaseRecoveryVersionAndRetention
      - name: Require one executed native test, never a skipped green result
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('tests/WhaleDeck.IntegrationTests/TestResults').glob('native-ci.trx'))
          assert len(reports) == 1, 'Native test evidence missing'
          tree = ET.parse(reports[0])
          counters = next(item for item in tree.iter() if item.tag.endswith('Counters'))
          assert counters.attrib['executed'] == counters.attrib['passed'] == counters.attrib['total'] == '1', 'Native test did not actually execute and pass'
          PY

  native-valkey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      valkey:
        image: valkey/valkey:9.1.2-alpine3.24@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
        ports:
          - 127.0.0.1:16379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restrict the disposable session fixture to its own key namespace
        env:
          VALKEY_CONTAINER: ${{ job.services.valkey.id }}
        run: docker exec "$VALKEY_CONTAINER" valkey-cli ACL SETUSER default resetkeys '~whaledeck:auth:session:v2:*' +@all -@dangerous
      - name: Run actual Valkey BFF session and revocation gate
        env:
          WHALEDECK_NATIVE_BFF_SESSION_ENDPOINT: 127.0.0.1:16379
        run: >-
          dotnet test tests/WhaleDeck.IntegrationTests/WhaleDeck.IntegrationTests.csproj
          --configuration Release --logger "trx;LogFileName=native-bff-valkey.trx"
          --filter FullyQualifiedName~NativeBffSessionTests
      - name: Require one executed native Valkey test without skips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=list(Path('tests/WhaleDeck.IntegrationTests/TestResults').glob('native-bff-valkey.trx'))
          assert len(reports)==1, 'Native Valkey evidence missing'
          counters=ET.parse(reports[0]).getroot().find('{*}ResultSummary/{*}Counters').attrib
          assert all(counters[k]=='1' for k in ('total','executed','passed')) and counters['notExecuted']=='0', 'Native Valkey test skipped or failed'
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          # setup-node probes pnpm from the repository root, which has no
          # packageManager pin. Do not fetch an unpinned manager before the
          # bounded, web-directory install step below.
          package-manager-cache: false
      - run: corepack enable
      - name: Install pinned frontend dependencies with bounded download retry
        run: bash ../deploy/ci/install-frontend-dependencies.sh
      - name: Verify bounded browser download evidence observer
        run: node --test ../deploy/validation/test_browser_download_probe.mjs
      - run: corepack pnpm lint
      - run: corepack pnpm format:check
      - run: corepack pnpm test:unit
      - run: corepack pnpm build
      - name: Install Chromium for production authorization regression
        run: corepack pnpm exec playwright install chromium --with-deps
      - name: Check bounded container detail and relationship layouts
        env:
          WHALEDECK_PRODUCTION_PREVIEW_URL: http://127.0.0.1:5175
        run: corepack pnpm exec playwright test e2e/container-detail.spec.ts e2e/container-relationships.spec.ts e2e/container-files.spec.ts --reporter=line
      - name: Check production authorization, file transfers and host/container terminal UI
        env:
          WHALEDECK_PRODUCTION_PREVIEW_URL: http://127.0.0.1:5175
        run: corepack pnpm exec playwright test e2e/auth-deep-link.production.spec.ts e2e/session-expiry.production.spec.ts e2e/host-terminal.spec.ts e2e/container-terminal.spec.ts e2e/files.spec.ts e2e/file-mutations.spec.ts e2e/file-browser.spec.ts e2e/file-location.spec.ts e2e/file-text.spec.ts e2e/file-archives.spec.ts e2e/tree-copies.spec.ts e2e/tree-moves.spec.ts e2e/tree-packings.spec.ts e2e/tree-unpackings.spec.ts e2e/tree-recyclings.spec.ts e2e/tree-restorings.spec.ts e2e/tree-overwrite-restorings.spec.ts e2e/tree-purgings.spec.ts e2e/capture-cleanup.spec.ts e2e/file-recovery.spec.ts e2e/topbar-badges.spec.ts e2e/platform-build.spec.ts e2e/file-content-search.spec.ts e2e/host-logs.spec.ts --reporter=line
