name: ci

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check shell syntax and side-effect-free preview
        run: |
          bash -n install.sh
          bash -n deploy/host/publish-and-install.sh
          bash -n deploy/host/install.sh
          bash tests/installer-cli.sh

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build --logger trx
      - run: dotnet list package --vulnerable --include-transitive

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm lint
      - run: corepack pnpm format:check
      - run: corepack pnpm test:unit
      - run: corepack pnpm build
      - name: Install Chromium for production authorization regression
        run: corepack pnpm exec playwright install chromium --with-deps
      - name: Check initial production route authorization
        env:
          WHALEDECK_PRODUCTION_PREVIEW_URL: http://127.0.0.1:5175
        run: corepack pnpm exec playwright test e2e/auth-deep-link.production.spec.ts --reporter=line
