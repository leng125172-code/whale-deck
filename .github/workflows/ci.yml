name: ci

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check shell syntax and side-effect-free preview
        run: |
          bash -n install.sh
          bash -n deploy/host/publish-and-install.sh
          bash -n deploy/host/install.sh
          bash tests/installer-cli.sh
          python3 -m unittest discover -s tests -p test_host_runtime.py
          bash -n deploy/build-images.sh
          python3 -m unittest discover -s tests -p 'test_build_*.py'
          bash -n deploy/host/whaledeck-platform-maintenance
          bash -n deploy/host/validate.sh
          python3 -W error -m py_compile deploy/host/whaledeck-platform-revisions.py
          python3 -W error -m py_compile deploy/host/whaledeck-platform-control-recovery.py
          python3 -W error -m py_compile deploy/validation/platform_control_recovery_systemd.py
          python3 -W error::ResourceWarning -m unittest discover -s tests -p 'test_platform_*.py'
          bash -n deploy/ci/install-frontend-dependencies.sh
          python3 -m unittest discover -s tests -p test_ci_frontend_install.py
          python3 -m unittest discover -s tests -p test_ci_frontend_shards.py
          bash -n deploy/host/whaledeck-privileged
          python3 -m unittest discover -s deploy/validation -p test_container_terminal.py
          sudo python3 -W error::ResourceWarning -m unittest discover -s deploy/validation -p 'test_container_file*.py'
          sudo python3 -W error::ResourceWarning -m unittest discover -s deploy/validation -p 'test_container_recycle*.py'
          python3 -W error::ResourceWarning -m unittest discover -s deploy/validation -p 'test_recursive_*_probe_scope.py'
          python3 -W error::ResourceWarning -m unittest discover -s deploy/validation -p 'test_acl*agent_probe_scope.py'
          python3 -W error -m py_compile deploy/validation/bound_container_recursive_permission_cut.py deploy/validation/validate_container_recursive_permission_browser.py deploy/validation/verify_container_recursive_permission_browser.py deploy/validation/validate_container_recursive_permission_faults.py deploy/validation/verify_container_recursive_permission_faults.py
          python3 -W error -m py_compile deploy/validation/bound_container_recursive_ownership_cut.py deploy/validation/validate_container_recursive_ownership_browser.py deploy/validation/verify_container_recursive_ownership_browser.py deploy/validation/recover_container_recursive_ownership_browser.py deploy/validation/validate_container_recursive_ownership_faults.py deploy/validation/verify_container_recursive_ownership_faults.py
          node --check deploy/validation/validate_container_recursive_permission_browser.mjs
          node --check deploy/validation/validate_container_recursive_permission_faults.mjs
          node --check deploy/validation/validate_container_recursive_ownership_browser.mjs
          python3 -W error -m py_compile deploy/validation/validate_container_recursive_acl_browser.py deploy/validation/verify_container_recursive_acl_browser.py deploy/validation/recover_container_recursive_acl_browser.py
          node --check deploy/validation/validate_container_recursive_acl_browser.mjs
